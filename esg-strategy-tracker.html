<title>ESG 중장기전략 진척관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap">
<style>
/* ============================================================
   디자인 토큰 — MongoDB 디자인 시스템 기반 (D-049)
   출처: DESIGN-mongodb.md. 색을 바꾸려면 이 세 블록만 고친다.
   마케팅 구조(히어로 밴드·프로모 배너)는 가져오지 않았다 — 이 앱은
   읽는 문서가 아니라 조작하는 화면이다 (CLAUDE.md 디자인 태도).
   ============================================================ */
:root{
  /* 글꼴 — Euclid Circular A 는 상용이라 있으면 쓰고, 없으면 Plus Jakarta Sans.
     한글 글리프는 두 서체에 없으므로 IBM Plex Sans KR 이 받는다. */
  --font-ui:"Euclid Circular A","Plus Jakarta Sans","IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Source Code Pro","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --ground:#F4F7F6;                              /* surface-soft */
  --frame:transparent; --frame-line:transparent; /* 프레임을 없앴다 — 평평한 캔버스 */
  --panel:#FFFFFF;                               /* canvas */
  --panel-2:#F9FBFA;                             /* surface */
  --cell:#FFFFFF; --cell-line:#ECEFF1;           /* hairline-soft */
  --ink:#001E2B;                                 /* ink */
  --ink-2:#3D4F5B;                               /* slate */
  --muted:#5C6C7A;                               /* steel */
  --line:#E1E5E8;                                /* hairline */
  --line-2:#ECEFF1;                              /* hairline-soft */
  --chip:#FFFFFF; --chip-line:#E1E5E8;

  /* 기본 동작 · 현재 시점 — MongoDB 그린.
     --today 는 글씨·테두리용 진한 초록, --today-fill 은 채움용 밝은 초록이다.
     밝은 초록은 흰 바탕에서 글씨로 쓰면 읽히지 않는다 (스펙 Don't 항목). */
  --today:#00684A;                               /* brand-green-dark */
  --today-fill:#00ED64;                          /* brand-green */
  /* 악센트 면 위의 글씨색. 라이트는 면이 어두워 흰 글씨, 다크는 면이 밝아 짙은 글씨다 */
  --on-accent:#FFFFFF;
  --today-soft:#E3FCEF;                          /* surface-feature */
  --on-today:#001E2B;                            /* on-primary */

  /* ESG 영역 · 대분류 — 카테고리 악센트. 이 다섯 색은 분류 표시에만 쓴다 */
  --e:#00794A; --s:#C44E18; --g:#6A2FD6;
  --cat-1:#00915A; --cat-2:#7B3FF2; --cat-3:#E05A22; --cat-4:#3D4F9F; --cat-5:#D2479B;

  --ok:#00684A; --ok-soft:#C3F0D2;               /* brand-green-dark / -soft */
  --warn:#6E5124; --warn-soft:#FFF8E0;           /* semantic-warning — 스펙 값은 대비 4.29라 한 단계 진하게 */
  --risk:#C2321F; --risk-soft:#FDEBE7;           /* 파생 — 스펙에 위험색이 없다 */
  --done:#3D4F9F; --done-soft:#E8EBF7;           /* accent-blue */

  --r-xl:24px; --r-lg:12px; --r:8px; --r-sm:6px;
  /* 그림자는 아끼고 헤어라인으로 나눈다 (스펙 Don't: 평평한 카드에 무거운 그림자 금지) */
  --sh:0 1px 2px rgba(0,30,43,.04);
  --sh-pop:0 16px 48px -8px rgba(0,30,43,.16);
  --sh-blk:0 4px 12px rgba(0,30,43,.08);
  /* 줄간격 · 여백 스케일 — 개별 값을 쓰지 말고 이 토큰만 쓴다 */
  --lh-h:1.2; --lh:1.55; --lh-s:1.5;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  color-scheme:light;
}
/* 다크 값은 스펙에 없다(Known Gaps). brand-teal-deep 을 캔버스로 삼아 파생했다. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#00141D; --frame:transparent; --frame-line:transparent;
    --panel:#001E2B; --panel-2:#00293A; --cell:#00232F; --cell-line:#123040;
    --ink:#FFFFFF; --ink-2:#C1CCD6; --muted:#A8B3BC; --line:#1C2D38; --line-2:#152730;
    --chip:#00293A; --chip-line:#1C2D38;
    --today:#00ED64; --today-fill:#00ED64; --today-soft:#023A2A; --on-today:#001E2B;
    --on-accent:#001E2B;
    --e:#1FD182; --s:#FF8F63; --g:#A98BFF;
    --cat-1:#1FD182; --cat-2:#A98BFF; --cat-3:#FF8F63; --cat-4:#8093E8; --cat-5:#F79AD0;
    --ok:#00ED64; --ok-soft:#023A2A;
    --warn:#E0B872; --warn-soft:#2E2617;
    --risk:#FF7A63; --risk-soft:#33150F;
    --done:#8093E8; --done-soft:#1A2140;
    --sh:0 1px 2px rgba(0,0,0,.45);
    --sh-pop:0 16px 48px -8px rgba(0,0,0,.75);
    --sh-blk:0 4px 12px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#00141D; --frame:transparent; --frame-line:transparent;
  --panel:#001E2B; --panel-2:#00293A; --cell:#00232F; --cell-line:#123040;
  --ink:#FFFFFF; --ink-2:#C1CCD6; --muted:#A8B3BC; --line:#1C2D38; --line-2:#152730;
  --chip:#00293A; --chip-line:#1C2D38;
  --today:#00ED64; --today-fill:#00ED64; --today-soft:#023A2A; --on-today:#001E2B;
  --on-accent:#001E2B;
  --e:#1FD182; --s:#FF8F63; --g:#A98BFF;
  --cat-1:#1FD182; --cat-2:#A98BFF; --cat-3:#FF8F63; --cat-4:#8093E8; --cat-5:#F79AD0;
  --ok:#00ED64; --ok-soft:#023A2A;
  --warn:#E0B872; --warn-soft:#2E2617;
  --risk:#FF7A63; --risk-soft:#33150F;
  --done:#8093E8; --done-soft:#1A2140;
  --sh:0 1px 2px rgba(0,0,0,.45);
  --sh-pop:0 16px 48px -8px rgba(0,0,0,.75);
  --sh-blk:0 4px 12px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui);
  font-size:14px; line-height:var(--lh); -webkit-font-smoothing:antialiased;
  padding:var(--s6);
}
h1,h2,h3,h4{font-family:var(--font-ui);font-weight:500;margin:0;line-height:var(--lh-h);letter-spacing:-.5px;text-wrap:balance}
p{margin:0;line-height:var(--lh)}
button,input,select,textarea{font:inherit;color:inherit;line-height:var(--lh)}
:focus-visible{outline:2px solid var(--today);outline-offset:2px;border-radius:8px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sub,.help,.meta,.tm,.ad,.upd,.tc{line-height:var(--lh-s)}

/* ================= frame ================= */
/* 프레임 없이 평평하게. 면은 헤어라인으로 나눈다 */
.app{
  max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:76px minmax(0,1fr);gap:var(--s3);
}
.rail{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s4) 0;
}
.logo{width:38px;height:38px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;margin-bottom:var(--s3);flex:none}
.logo svg{width:19px;height:19px}
.rail-nav{display:flex;flex-direction:column;gap:var(--s1);flex:1}
.ricon{
  width:44px;height:44px;border-radius:var(--r);border:1px solid transparent;background:none;cursor:pointer;
  display:grid;place-items:center;color:var(--muted);
}
.ricon:hover{background:var(--panel-2);color:var(--ink)}
.ricon[aria-current="page"]{background:var(--ink);color:var(--panel);box-shadow:var(--sh-blk)}
.ricon svg{width:19px;height:19px}
.ricon[hidden]{display:none}

.stage{display:flex;flex-direction:column;gap:var(--s3);min-width:0}

/* ================= topbar : 현재 화면의 하위 탭 ================= */
.topbar{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);
  padding:var(--s2) var(--s3);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
}
.subtabs{display:flex;gap:var(--s1);flex-wrap:wrap;min-width:0}
.stab{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  border-radius:99px;padding:8px 15px;cursor:pointer;font-weight:500;font-size:13px;color:var(--ink-2);white-space:nowrap;
}
.stab:hover{background:var(--panel-2);color:var(--ink)}
.stab[aria-current="true"]{background:var(--today-soft);border-color:transparent;color:var(--today);font-weight:600}
.stab svg{width:15px;height:15px;flex:none}
.stab .n{font-family:var(--font-mono);font-size:11px;opacity:.8}
.crumbtab{display:flex;align-items:center;gap:var(--s3);min-width:0}
.backbtn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--today-fill);
  border-radius:99px;padding:10px 22px 10px 16px;cursor:pointer;font-weight:600;font-size:14px;
  color:var(--on-today);white-space:nowrap;
}
.backbtn:hover{filter:brightness(1.12)}
.backbtn:active{filter:brightness(.94)}
.backbtn svg{width:15px;height:15px;flex:none}
.crumbtab .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none;
}
.iconbtn:hover{background:var(--panel-2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.spacer{flex:1;min-width:var(--s2)}
.stack{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px}
.av{
  width:30px;height:30px;border-radius:99px;display:grid;place-items:center;flex:none;
  font-family:var(--font-ui);font-weight:700;font-size:10.5px;color:#fff;
  border:2px solid var(--panel);margin-right:-9px;line-height:1;
}
.stack .more{margin-left:16px;font-size:12px;font-weight:600;color:var(--muted);font-family:var(--font-mono)}
.pillbtn{
  display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:9px 16px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:13px;white-space:nowrap;
}
.pillbtn:hover{background:var(--panel-2)}
.pillbtn.dark{background:var(--today-fill);color:var(--on-today);border-color:var(--today-fill);font-weight:600}
.pillbtn.dark:hover{filter:brightness(1.06);background:var(--today-fill)}
.pillbtn svg{width:15px;height:15px}
.pillbtn[hidden]{display:none}
.pillbtn:disabled{opacity:.45;cursor:not-allowed}

/* ================= panels ================= */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:var(--s5) 22px;min-width:0}
.ph{display:flex;align-items:flex-start;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.ph h2{font-size:23px;font-weight:800}
.ph h3{font-size:17px;font-weight:800}
.ph .sub{font-size:12.5px;color:var(--muted);margin-top:var(--s1)}
.ph .r{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ghost{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  border-radius:99px;padding:6px 13px;font-size:12px;cursor:pointer;color:var(--ink-2);white-space:nowrap;
}
.ghost:hover{background:var(--panel-2);color:var(--ink)}
.ghost.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ghost.risk{background:var(--risk-soft);color:var(--risk);border-color:transparent}
.ghost.flat{cursor:default}
.ghost svg{width:13px;height:13px}
select.ghost{width:auto;max-width:220px;padding-right:26px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 54%,calc(100% - 9px) 54%;background-size:5px 5px;background-repeat:no-repeat}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:var(--s2);margin-bottom:var(--s4)}
.sbox{background:var(--panel-2);border-radius:var(--r);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s1)}
.sbox .k{font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.sbox .v{font-family:var(--font-ui);font-weight:800;font-size:21px;line-height:1.15}
.sbox .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:1px}
.sbox.risk{box-shadow:inset 3px 0 0 var(--risk)}
.sbox.warn{box-shadow:inset 3px 0 0 var(--warn)}
.sbox.ok{box-shadow:inset 3px 0 0 var(--ok)}

/* ================= timeline ================= */
/* 과제가 많아지면 세로로도 스크롤. 분기 헤더는 위에 고정된다 */
.tl-wrap{overflow:auto;padding-bottom:var(--s1);scrollbar-width:thin}
.tl-head{position:sticky;top:0;z-index:6;background:var(--panel)}
.tl-head .tl-name{z-index:7}
.tl-more{font-size:11.5px;color:var(--muted);margin-top:var(--s2);text-align:right;font-family:var(--font-mono)}
.tl{min-width:min-content}
.tl-row{display:flex;align-items:stretch}
.tl-name{flex:none;position:sticky;left:0;z-index:3;background:var(--panel);padding-right:var(--s3);display:flex;align-items:center}
.tl-head .tl-name{align-items:flex-end;padding-bottom:9px}
.tl-name .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);font-weight:600;line-height:1.4}
.card-name{
  display:flex;align-items:center;gap:var(--s2);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s2) 11px;background:var(--panel);width:100%;min-width:0;text-align:left;cursor:pointer;
}
.card-name:hover{background:var(--panel-2);border-color:var(--muted)}
.card-name .ic{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center}
.card-name .ic svg{width:15px;height:15px;color:var(--panel)}
.card-name .tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.card-name .t1{font-weight:600;font-size:13px;line-height:var(--lh-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-name .t2{font-size:11px;color:var(--muted);line-height:var(--lh-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-name .t3{font-size:10.5px;color:var(--muted);line-height:var(--lh-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono)}

.tl-track{position:relative;flex:none;display:flex}
.tl-head .tl-track{align-items:flex-end}
.qh{flex:none;text-align:center;padding:5px 0 9px;border-radius:12px 12px 0 0}
.qh .q{display:block;font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.35}
.qh .y{display:block;font-size:9.5px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.04em;line-height:1.35}
.qh.past .q,.qh.past .y{color:var(--muted);opacity:.75}
.qh.now{background:var(--today-fill)}
.qh.now .q,.qh.now .y{color:var(--on-today)}

.tl-body{position:relative}
.tl-body .tl-row{padding:5px 0}
.cellrow{position:absolute;inset:0;display:flex;pointer-events:none}
.cl{flex:none;border-radius:12px;background:var(--cell);box-shadow:0 0 0 1px var(--cell-line) inset;margin:5px 3px}
.cl.past{background:transparent;background-image:repeating-linear-gradient(45deg,transparent 0 4px,var(--cell-line) 4px 5.5px)}
.nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--today);z-index:4;pointer-events:none;opacity:.9}

.blk{
  position:absolute;top:5px;bottom:5px;border-radius:14px;box-shadow:var(--sh-blk);
  display:flex;align-items:center;justify-content:center;padding:0 var(--s3);overflow:hidden;cursor:pointer;
  border:0;text-align:left;color:var(--on-accent);z-index:2;
}
.blk.has-chip{padding-right:122px}
.blk:hover{filter:brightness(1.06)}
/* 블록 위에는 흰 글씨가 얹히므로 악센트를 그대로 쓰지 않고 한 단계 눌러 깐다 */
.blk.esg-E{background:linear-gradient(135deg,color-mix(in srgb,var(--e) 88%,#001E2B),color-mix(in srgb,var(--e) 58%,#001E2B))}
.blk.esg-S{background:linear-gradient(135deg,color-mix(in srgb,var(--s) 88%,#001E2B),color-mix(in srgb,var(--s) 58%,#001E2B))}
.blk.esg-G{background:linear-gradient(135deg,color-mix(in srgb,var(--g) 88%,#001E2B),color-mix(in srgb,var(--g) 58%,#001E2B))}
.blk .bmid{display:flex;align-items:center;gap:9px;min-width:0;margin-bottom:3px}
.blk .bic{width:26px;height:26px;border-radius:var(--r-sm);background:color-mix(in srgb,currentColor 20%,transparent);display:grid;place-items:center;flex:none}
.blk .bic svg{width:14px;height:14px}
.blk .bt{display:block;font-weight:600;font-size:12.5px;line-height:var(--lh-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.blk .bar{position:absolute;left:11px;right:11px;bottom:6px;height:3px;border-radius:99px;background:color-mix(in srgb,currentColor 26%,transparent);overflow:hidden}
.blk .bar i{display:block;height:100%;border-radius:99px;background:currentColor}
.blk .bchip{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:var(--chip);border-radius:99px;padding:2px 9px;font-size:10.5px;font-weight:700;line-height:1.7;
  display:flex;align-items:center;gap:4px;backdrop-filter:blur(6px);white-space:nowrap;
}
.blk .bchip .d{width:5px;height:5px;border-radius:99px;flex:none}
.tl-legend{display:flex;gap:var(--s4);flex-wrap:wrap;align-items:center;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.tl-legend .li{display:flex;align-items:center;gap:6px}
.tl-legend .sw{width:11px;height:11px;border-radius:4px;flex:none}
.tl-legend .hatch{background-image:repeating-linear-gradient(45deg,transparent 0 3px,var(--muted) 3px 4px);box-shadow:0 0 0 1px var(--line) inset}

/* ================= bottom grid ================= */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s3);align-items:start}

/* action cards */
.acards{display:flex;flex-direction:column;gap:var(--s2)}
.acard{
  border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);background:var(--panel);
  text-align:left;cursor:pointer;width:100%;display:flex;flex-direction:column;gap:var(--s2);
}
.acard:hover{background:var(--panel-2)}
.acard.hot{background:var(--warn-soft);border-color:transparent}
.acard .whyhot{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--warn);line-height:1.5}
.acard .whyhot::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--warn);flex:none}
.acard .ah{display:flex;align-items:flex-start;gap:9px}
.acard .at{font-weight:700;font-size:13.5px;line-height:var(--lh-s);min-width:0}
.acard .ab{
  margin-left:auto;flex:none;background:var(--chip);border:1px solid var(--chip-line);border-radius:99px;
  padding:2px 9px;font-size:10.5px;font-weight:700;line-height:1.7;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.acard.hot .ab{background:var(--panel);border-color:transparent}
.acard .ad{font-size:12px;color:var(--muted)}
.acard.hot .ad{color:var(--ink-2)}
.acard .achips{display:flex;gap:6px;flex-wrap:wrap}
.acard .anote{font-size:12px;color:var(--ink-2);background:var(--panel-2);border-radius:var(--r-sm);padding:var(--s2) 11px;line-height:var(--lh-s)}
.acard.hot .anote{background:var(--panel)}
.acard .anote b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);margin-bottom:2px}
.mini{
  display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border-radius:99px;
  padding:4px 10px;font-size:11px;font-weight:500;color:var(--ink-2);white-space:nowrap;line-height:1.5;
}
.acard.hot .mini{background:var(--panel)}
.mini svg{width:12px;height:12px;opacity:.7}
.mini b{font-family:var(--font-mono);font-weight:600;color:var(--ink)}

/* team cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:var(--s2)}
.tcard{border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s3);text-align:center;background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.tav{border-radius:99px;display:grid;place-items:center;color:#fff;font-family:var(--font-ui);font-weight:800;line-height:1;flex:none}
.tcard .tav{width:44px;height:44px;font-size:14px;margin-bottom:var(--s1)}
.tcard .tn{font-weight:700;font-size:12.5px;line-height:var(--lh-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tcard .tm{font-size:10.5px;color:var(--muted)}
.tcard .tp{display:flex;align-items:center;gap:5px;background:var(--panel-2);border-radius:99px;padding:3px 10px;margin-top:var(--s1);font-size:11px;font-weight:600;line-height:1.5}
.tcard .ttrack{width:100%;margin-top:var(--s2)}
.track{height:6px;border-radius:99px;background:var(--line-2);position:relative;overflow:hidden}
.track > i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok)}
.track > b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.32}

/* site group */
.sgroup{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:var(--s2)}
.sgh{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--panel-2);flex-wrap:wrap}
.sgh .nm{font-family:var(--font-ui);font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:var(--s2)}
.sgh .nm .tav{width:26px;height:26px;font-size:10px}
.sgh .mt{font-size:11.5px;color:var(--muted)}
.sgh .rr{margin-left:auto;display:flex;align-items:center;gap:var(--s3);min-width:190px;flex:1;max-width:320px}
.sgh .rr .pv{font-family:var(--font-mono);font-weight:600;font-size:13.5px;flex:none}
.sgb{padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.trow2{display:grid;grid-template-columns:minmax(0,1fr) 128px minmax(120px,180px) 92px;gap:var(--s3);align-items:center}
.trow2 .nm{display:flex;align-items:center;gap:9px;min-width:0}
.trow2 .nm .tav{width:30px;height:30px;font-size:11px}
.trow2 .t1{font-weight:600;font-size:13px;line-height:var(--lh-s)}
.trow2 .t2{font-size:11px;color:var(--muted);line-height:var(--lh-s)}
.trow2 .pl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:var(--s1)}
.trow2 .pl b{font-family:var(--font-mono);font-size:12.5px;color:var(--ink)}
.pills{display:flex;gap:5px;flex-wrap:wrap}

/* summary orb */
.orb-panel{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--s6) 22px;gap:0}
/* 평평한 강조 원 — MongoDB 의 featured 타일(민트 면 + 초록 테두리)을 원형으로 옮겼다.
   광택 그라디언트를 쓰면 면의 밝기가 자리마다 달라 글씨 대비를 보장할 수 없다. */
.orb{
  width:150px;height:150px;border-radius:99px;position:relative;margin:var(--s1) 0 var(--s4);flex:none;
  background:var(--today-soft);border:2px solid var(--today-fill);
}
.orb .on{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.orb .on .v{font-family:var(--font-ui);font-weight:800;font-size:40px;line-height:1}
.orb .on .k{font-size:10.5px;letter-spacing:.1em;font-family:var(--font-mono);color:var(--ink-2);margin-top:2px;line-height:1.4}
.orb-panel h3{font-size:19px;font-weight:800;margin-bottom:var(--s1)}
.orb-panel .od{font-size:12.5px;color:var(--muted);max-width:34ch;margin-bottom:var(--s4);line-height:var(--lh-s)}
.orb-panel .od b{color:var(--ink)}
.ostats{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:var(--s3)}
.ostat{background:var(--panel-2);border-radius:var(--r);padding:9px 13px;min-width:80px}
.ostat .k{font-size:10px;color:var(--muted);white-space:nowrap;line-height:1.4}
.ostat .v{font-family:var(--font-ui);font-weight:800;font-size:19px;line-height:1.2;margin-top:1px}
.ostat .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:1px}
.ostat.risk .v{color:var(--risk)}
.oacts{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.75}
.pill.s-ok{background:var(--ok-soft);color:var(--ok)}
.pill.s-warn{background:var(--warn-soft);color:var(--warn)}
.pill.s-risk{background:var(--risk-soft);color:var(--risk)}
.pill.s-done{background:var(--done-soft);color:var(--done)}
.pill.s-none{background:var(--line-2);color:var(--muted)}
.pill.s-carry{background:var(--today-soft);color:var(--today)}
.lc-closed{opacity:.5}
.thist{display:flex;flex-direction:column;gap:var(--s2);font-size:12px}
.thist .th1{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:baseline}
.thist .th1 .w{font-family:var(--font-mono);color:var(--muted);font-size:11px}
.thist .ch{color:var(--ink-2);line-height:var(--lh-s)}
.thist .ch b{font-weight:600}
.thist .ch s{color:var(--muted);text-decoration-thickness:1px}
.ytline{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);line-height:var(--lh-s);margin-top:var(--s1)}
.ytline b{color:var(--ink);font-weight:600}
.miss-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.miss-row:last-child{border-bottom:0}
.miss-row .sname{color:var(--muted);font-size:11px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 11px 2px 9px;font-size:11px;color:var(--ink-2);white-space:nowrap;background:var(--panel);line-height:1.75}
.tag .dot{width:7px;height:7px;border-radius:99px;flex:none}
.dot-E{background:var(--e)} .dot-S{background:var(--s)} .dot-G{background:var(--g)}

/* ================= list ================= */
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:var(--s3)}
.search{position:relative;flex:1;min-width:190px;max-width:340px}
.search input{padding-left:34px;border-radius:99px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;width:14px;height:14px}
.list{display:flex;flex-direction:column;gap:var(--s2)}
.item{
  display:grid;grid-template-columns:minmax(0,1fr) 118px 136px 104px;gap:var(--s4);align-items:center;
  padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  cursor:pointer;text-align:left;width:100%;min-height:64px;
}
.item:hover{background:var(--panel-2);border-color:var(--muted)}
.item .ttl{font-weight:600;font-size:13.5px;line-height:var(--lh-s);margin-bottom:var(--s1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.item .meta .sep{opacity:.4}
.item .prog{display:flex;flex-direction:column;gap:var(--s1)}
.item .prog .pl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.item .prog .pl b{font-family:var(--font-mono);font-size:12.5px;color:var(--ink)}
.item .upd{font-size:11.5px;color:var(--muted);font-family:var(--font-mono)}
.item .upd em{font-style:normal;color:var(--risk);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:44px 24px;text-align:center;color:var(--muted);background:var(--panel-2)}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:var(--s2)}
.empty p{margin:0 auto var(--s4);max-width:46ch;font-size:13px}

/* ================= detail ================= */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:var(--s2);margin-bottom:var(--s4)}
.kpi-grid .c{background:var(--panel-2);border-radius:var(--r);padding:var(--s3) var(--s4)}
.kpi-grid .c .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);line-height:1.5}
.kpi-grid .c .v{font-family:var(--font-ui);font-weight:800;font-size:19px;line-height:1.25;margin-top:2px}
.kpi-grid .c .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
.form-doc{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel)}
.drow{display:grid;grid-template-columns:136px minmax(0,1fr);border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.dlabel{
  background:var(--panel-2);color:var(--ink);padding:var(--s3);font-family:var(--font-ui);
  font-weight:700;font-size:12.5px;text-align:center;display:flex;flex-direction:column;justify-content:center;
  gap:2px;border-right:1px solid var(--line);line-height:var(--lh-h);
}
.dlabel small{font-weight:500;font-size:10.5px;color:var(--muted);font-family:var(--font-ui);line-height:var(--lh-s)}
.dbody{padding:var(--s4) var(--s5);min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split > div{padding:var(--s4) var(--s5);min-width:0}
.split > div:first-child{border-right:1px solid var(--line)}
.blk-h{font-family:var(--font-ui);font-weight:700;font-size:12.5px;margin-bottom:var(--s3);display:flex;align-items:center;gap:var(--s2);line-height:var(--lh-h)}
.blk-h .r{margin-left:auto;font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--muted)}
.plans{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s2)}
.plans li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2);align-items:start}
.ptext{font-size:13px;line-height:var(--lh-s)}
.plans li[data-st="done"] .ptext{color:var(--muted)}
.pmeta{display:block;font-size:10.5px;color:var(--muted);font-family:var(--font-mono);margin-top:1px;line-height:1.45}
.ytrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:var(--s2)}
.ytcell{display:flex;flex-direction:column;gap:3px}
.ytcell .yy{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);text-align:center}
.ytcell input{text-align:center;padding:8px 6px}
.ytcell input[readonly]{background:var(--panel-2);color:var(--muted)}
.ytcell input.bad{border-color:var(--risk);box-shadow:0 0 0 3px var(--risk-soft)}
.ytwarn{font-size:11.5px;color:var(--risk);font-weight:500;line-height:var(--lh-s)}
.dlrow{display:grid;grid-template-columns:84px minmax(0,1fr) auto auto;gap:var(--s2);align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--line-2)}
.dlrow:last-of-type{border-bottom:0}
.dlrow .qp{font-family:var(--font-mono);font-weight:600;font-size:13px}
.dlrow .st{font-size:11px;white-space:nowrap}
.dlrow input[type=date]{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;width:100%}
.pchip{
  border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:10.5px;font-weight:700;line-height:1.7;
  white-space:nowrap;background:var(--panel);color:var(--muted);min-width:56px;text-align:center;
}
button.pchip{cursor:pointer}
button.pchip:hover{border-color:var(--ink)}
.pchip[data-st="doing"]{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pchip[data-st="done"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.qlog{display:flex;flex-direction:column;gap:var(--s4)}
.qlog .q{border-left:2px solid var(--line);padding-left:var(--s4);position:relative}
.qlog .q::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:99px;background:var(--ok);border:2px solid var(--panel)}
.qlog .q.mo{border-left-style:dotted}
.qlog .q.mo::before{background:var(--panel);border-color:var(--line)}
.qlog .qh2{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:var(--s1)}
.qlog .qp{font-family:var(--font-mono);font-weight:500;font-size:12.5px}
.qlog .qv{font-family:var(--font-ui);font-weight:800;font-size:15px}
.qlog .qa{font-size:11px;color:var(--muted);margin-left:auto}
.qlog .qtext{font-size:12.5px;white-space:pre-wrap;color:var(--ink-2);line-height:var(--lh-s)}

/* ================= forms ================= */
.field{display:flex;flex-direction:column;gap:var(--s1)}
.field > label{font-size:11.5px;font-weight:600;color:var(--ink-2);line-height:var(--lh-s)}
.field .req{color:var(--risk);margin-left:2px}
.help{font-size:11.5px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=search],select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;width:100%;
}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--today);box-shadow:0 0 0 3px var(--today-soft)}
textarea{resize:vertical;min-height:76px}
select{cursor:pointer;appearance:none;padding-right:32px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select:disabled{opacity:.55;cursor:not-allowed}
dialog{
  border:1px solid var(--line);border-radius:24px;padding:0;background:var(--panel);color:var(--ink);
  max-width:min(780px,94vw);width:100%;box-shadow:var(--sh-pop);
}
dialog::backdrop{background:rgba(24,30,38,.5);backdrop-filter:blur(4px)}
.dlg-h{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s5) 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;border-radius:24px 24px 0 0}
.dlg-h h2{font-size:18px;font-weight:800}
.dlg-h p{margin-top:3px;font-size:12.5px;color:var(--muted);line-height:var(--lh-s)}
.dlg-h .x{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 7px;border-radius:9px}
.dlg-h .x:hover{background:var(--panel-2);color:var(--ink)}
.dlg-b{padding:var(--s5) 24px;display:flex;flex-direction:column;gap:var(--s4);max-height:min(70vh,660px);overflow-y:auto}
.dlg-f{display:flex;gap:var(--s2);justify-content:flex-end;padding:var(--s4) 24px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 24px 24px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:var(--s3)}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:var(--s3)}
.fieldset{border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.fieldset > legend{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);padding:0 7px;font-weight:600}
.calcbox{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;background:var(--today-soft);border-radius:var(--r);padding:var(--s3) var(--s4)}
.calcbox .n{font-family:var(--font-ui);font-weight:800;font-size:27px;color:var(--today);line-height:1}
.calcbox .d{font-size:12px;color:var(--ink-2);line-height:var(--lh-s)}
.err{color:var(--risk);font-size:12.5px;font-weight:500}
.banner{border-radius:var(--r);padding:11px var(--s4);font-size:12.5px;margin-bottom:var(--s3);background:var(--warn-soft);color:var(--warn);border-left:3px solid var(--warn);line-height:var(--lh-s)}
.banner.ro{background:var(--done-soft);color:var(--done);border-left-color:var(--done)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--s2);align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--line-2)}
.mrow:last-of-type{border-bottom:0}
.mrow .tc{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap}
.simwarn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:9px var(--s3);font-size:12.5px;line-height:var(--lh-s)}
.mhead{font-family:var(--font-ui);font-weight:800;font-size:13px;margin:var(--s3) 0 var(--s1);display:flex;align-items:center;gap:var(--s2)}
.mhead:first-child{margin-top:0}
.mhead .tav{width:22px;height:22px;font-size:9px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn-primary{background:var(--today-fill);border-color:var(--today-fill);color:var(--on-today);font-weight:600}
.btn-primary:hover{filter:brightness(1.06);background:var(--today-fill)}
.btn-danger{color:var(--risk)}
.btn-danger:hover{background:var(--risk-soft);border-color:var(--risk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:5px 12px;font-size:12px}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99;
  background:var(--ink);color:var(--panel);padding:11px 20px;border-radius:99px;font-size:13px;font-weight:500;
  box-shadow:var(--sh-pop);max-width:min(560px,90vw);text-align:center;line-height:var(--lh-s);
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .22s ease-out}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.skeleton{color:var(--muted);font-size:13px}

/* ================= 인쇄 (D-024) ================= */
#printRoot{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:10pt}
  .app,dialog,.toast{display:none!important}
  #printRoot{display:block!important}
  @page{size:A4 portrait;margin:13mm}
  .pr-page{page-break-after:always}
  .pr-page:last-child{page-break-after:auto}
}
.pr-page{padding:0 0 12mm}
.pr-h{display:flex;align-items:flex-end;gap:12mm;border-bottom:2px solid #000;padding-bottom:3mm;margin-bottom:5mm}
.pr-h h1{font-size:16pt;font-weight:800;margin:0}
.pr-sub{font-size:8.5pt;color:#444;margin-top:1mm}
.pr-big{margin-left:auto;text-align:right;font-family:var(--font-ui);font-weight:800;font-size:24pt;line-height:1}

<script>
/* ============================ helpers ============================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl2 = s => esc(s).replace(/\n/g, "<br>");
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const ESG = { E: "환경 (Environmental)", S: "사회 (Social)", G: "지배구조 (Governance)" };
const ESG_SHORT = { E: "환경", S: "사회", G: "지배구조" };
/* 대분류 (D-046) — 팀을 가로지르는 주제 축. ESG 영역(E·S·G)과 별개로 함께 단다.
   목록은 중대성 평가로 바뀔 수 있으므로 여기 한 곳에서만 고친다. */
/* 색은 MongoDB 카테고리 악센트 5종. 분류 표시 밖에서는 쓰지 않는다 */
const CATS = [
  ["E-CLM", "환경·기후", "var(--cat-1)"],
  ["S-HRT", "인권·노동", "var(--cat-2)"],
  ["S-SFT", "안전보건", "var(--cat-3)"],
  ["G-SCM", "공급망", "var(--cat-4)"],
  ["G-DIS", "공시·규제 대응", "var(--cat-5)"],
];
const CAT_NAME = Object.fromEntries(CATS.map(c => [c[0], c[1]]));
const CAT_COLOR = Object.fromEntries(CATS.map(c => [c[0], c[2]]));
const catOf = s => (s && CAT_NAME[s.category]) ? s.category : "";
const catLabel = s => catOf(s) ? CAT_NAME[catOf(s)] : "분류 미지정";
const ST = { todo: "미착수", doing: "진행중", done: "완료" };
const ST_ORDER = ["todo", "doing", "done"];
const ST_WEIGHT = { todo: 0, doing: 0.5, done: 1 };
const STATUS_VAR = { ok: "var(--ok)", warn: "var(--warn)", risk: "var(--risk)", done: "var(--done)", none: "var(--muted)" };
const STATUS_ORDER = { risk: 0, warn: 1, none: 2, ok: 3, done: 4, closed: 5, stopped: 6 };
/* 과제 라이프사이클 (D-030). 이월은 닫는 것이 아니라 기간을 늘린 기록이므로 active로 남는다. */
const LC = { active: "진행", done: "종료", stopped: "중단" };
const isClosed = x => x && (x.lifecycle === "done" || x.lifecycle === "stopped");
const isOpen = x => !isClosed(x);
const carryCount = x => (x && Array.isArray(x.carries)) ? x.carries.length : 0;
const ESG_ICON = {
  E: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 17c0-5 2.6-8.4 6.6-9.4C16.6 12.4 14 16 10 17Z"/><path d="M10 17C6 16 3.4 12.4 3.4 7.6 7.4 8.6 10 12 10 17Z"/></svg>',
  S: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="6.4" r="2.6"/><path d="M4.4 16.4c0-3.1 2.5-5.2 5.6-5.2s5.6 2.1 5.6 5.2"/></svg>',
  G: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 3l6.4 3.1v4.3c0 3.4-2.6 6.2-6.4 7.2-3.8-1-6.4-3.8-6.4-7.2V6.1L10 3Z"/><path d="M7.6 10.2l1.8 1.8 3.2-3.4"/></svg>'
};
const ICO = {
  road: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 5.5h9M3 10h14M3 14.5h6"/><rect x="13.4" y="3.6" width="3.6" height="3.6" rx="1"/><rect x="7.4" y="12.6" width="3.6" height="3.6" rx="1"/></svg>',
  all: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.6" y="2.6" width="6.2" height="7.1" rx="1.4"/><rect x="11.2" y="2.6" width="6.2" height="4.1" rx="1.4"/><rect x="11.2" y="9.1" width="6.2" height="8.3" rx="1.4"/><rect x="2.6" y="12.1" width="6.2" height="5.3" rx="1.4"/></svg>',
  attn: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 3.4 17.6 16.6H2.4L10 3.4Z"/><path d="M10 8v3.4M10 13.6h.01"/></svg>',
  team: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7.2" cy="7" r="2.7"/><path d="M2.6 16.4c0-2.8 2-4.6 4.6-4.6s4.6 1.8 4.6 4.6"/><circle cx="14.4" cy="7.9" r="2.1"/></svg>',
  cal: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.6" width="14" height="12.4" rx="2.2"/><path d="M3 8.4h14M7 3v3M13 3v3"/></svg>',
  site: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 17V7.5L9 4l6 3.5V17"/><path d="M7.6 17v-4.4h3.8V17"/><path d="M1.6 17h16.8"/></svg>'
};

/* --- 기간 --- */
const isQuarter = p => /-Q[1-4]$/.test(String(p));
function curQuarter(d = new Date()) { return d.getFullYear() + "-Q" + (Math.floor(d.getMonth() / 3) + 1); }
function curMonth(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function qIdx(p) { const [y, q] = String(p).split("-Q"); return (+y) * 4 + (+q - 1); }
function qFromIdx(i) { return Math.floor(i / 4) + "-Q" + (i % 4 + 1); }
function pSort(p) {
  if (isQuarter(p)) { const [y, q] = p.split("-Q"); return (+y) * 12 + (+q * 3 - 1); }
  const [y, m] = String(p).split("-"); return (+y) * 12 + (+m - 1);
}
function pLabel(p) {
  if (isQuarter(p)) { const [y, q] = p.split("-Q"); return "'" + String(y).slice(2) + " " + q + "Q"; }
  const [y, m] = String(p).split("-"); return "'" + String(y).slice(2) + "." + m;
}
function quarterOptions(back = 8, fwd = 1) {
  const now = qIdx(curQuarter()), out = [];
  for (let i = now + fwd; i >= now - back; i--) out.push(qFromIdx(i));
  return out;
}
function monthOptions(back = 14, fwd = 1) {
  const d = new Date(), base = d.getFullYear() * 12 + d.getMonth(), out = [];
  for (let i = base + fwd; i >= base - back; i--) out.push(Math.floor(i / 12) + "-" + String(i % 12 + 1).padStart(2, "0"));
  return out;
}
function relTime(iso) {
  if (!iso) return "—";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "일 전";
  return new Date(iso).toLocaleDateString("ko-KR", { year: "2-digit", month: "2-digit", day: "2-digit" });
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;

/* ============================ db ============================ */
(async function boot() {
  render();
  let db = null;
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) { state.dbFailed = true; state.ready = true; render(); return; }
  state.db = db;
  db.doc("system/writeProbe").set({ at: new Date().toISOString() })
    .then(() => { state.canEdit = true; })
    .catch(e => { state.canEdit = !(e && e.code === "invalid_argument"); })
    .finally(() => { state.probed = true; render(); });
  const onErr = () => { state.dbFailed = true; render(); };
  const sub = (name, key) => db.collection(name).onSnapshot(snap => {
    state[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.ready = true; render();
  }, onErr);
  sub("companies", "companies");
  sub("sites", "sites"); sub("teams", "teams"); sub("strategies", "strategies"); sub("progress", "progress");
  sub("deadlines", "deadlines");
  setTimeout(() => { if (!state.ready) { state.ready = true; render(); } }, 4000);
})();

async function save(path, body, mode) {
  if (!state.db) throw { code: "no_db" };
  const ref = state.db.doc(path);
  return mode === "update" ? ref.update(body) : ref.set(body);
}
function writeError(e) {
  if (!e) return "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  if (e.code === "no_db") return "저장소에 연결되지 않아 저장할 수 없습니다. 새로고침 후 다시 시도해 주세요.";
  if (e.code === "invalid_argument") return "보기 전용 권한으로는 저장할 수 없습니다. 담당자 권한이 필요하면 ESG 사무국에 요청해 주세요.";
  if (e.code === "quota_exceeded") return "저장 한도에 도달했습니다. 오래된 과제를 정리한 뒤 다시 시도해 주세요.";
  if (e.code === "resource_exhausted") return "요청이 몰렸습니다. 잠시 후 다시 시도해 주세요.";
  return "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
}

/* ============================ render ============================ */
function render() {
  /* 첫 진입 화면 결정 (D-042) — 데이터가 도착한 뒤 한 번만 */
  if (state.ready && !state.landed) {
    state.landed = true;
    /* 팀 이름만 저장돼 있던 예전 브라우저를 teamId로 옮긴다 */
    if (!state.me.teamId && state.me.team) {
      const old = state.teams.find(x => x.name === state.me.team);
      if (old) { state.me.teamId = old.id; try { localStorage.setItem("esg.me", JSON.stringify(state.me)); } catch (e) { } }
    }
    if (!state.me.teamId) state.view = "pick";
    else if (state.me.teamId !== "__all") state.view = "myco";
  }

  const ed = state.canEdit;
  $("#railNew").hidden = !ed; $("#topNew").hidden = !ed; $("#setMe").hidden = !ed;
  $("#topNew").disabled = !state.db;
  document.querySelectorAll("#rail .ricon[data-view]").forEach(b =>
    b.dataset.view === state.view && state.view !== "detail"
      ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  renderSubtabs();


  const m = $("#main");
  if (state.view === "detail" && state.selected) m.innerHTML = viewDetail(state.selected);
  else if (state.view === "list") m.innerHTML = viewList();
  else if (state.view === "myco") m.innerHTML = viewMyCo();
  else if (state.view === "pick") m.innerHTML = viewPickTeam();
  else if (state.view === "teams") m.innerHTML = viewTeams();
  else if (state.view === "new") { state.view = "list"; render(); openStrategyForm(null); return; }
  else m.innerHTML = viewGroup();
  bind(m);
  restoreTimelineScroll();
}

/** 도넛 — 대분류별 과제 분포 (D-046). 조각이 하나뿐이어도 원으로 보이게 둔다 */
function donutSvg(slices, big, small) {
  const total = slices.reduce((a, x) => a + x.n, 0) || 1;
  const R = 52, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = slices.map(x => {
    const len = x.n / total * C;
    const el = `<circle cx="68" cy="68" r="${R}" fill="none" stroke="${x.color}" stroke-width="21"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 68 68)"></circle>`;
    off += len;
    return el;
  }).join("");
  return `<svg viewBox="0 0 136 136" role="img" aria-label="대분류별 과제 분포">${arcs}
    <text class="mid" x="68" y="70">${esc(String(big))}</text>
    <text class="midk" x="68" y="84">${esc(String(small))}</text></svg>`;
}

const COLW = 66;
function timelineHtml(rows, opts) {

  const cq = curQuarter(), nowI = qIdx(cq);
  const startIs = rows.map(x => { const p = spanOf(x); return qOfYM(p.sy, p.sm); });
  const endIs = rows.map(x => { const p = spanOf(x); return qOfYM(p.ey, p.em); });
  const firstI = Math.min(...startIs, nowI - 2), lastI = Math.max(...endIs, nowI + 2);
  const N = lastI - firstI + 1, trackW = N * COLW;

  const headCells = Array.from({ length: N }, (_, i) => {
    const gi = firstI + i, [y, qn] = qFromIdx(gi).split("-Q");
    const cls = gi === nowI ? "now" : (gi < nowI ? "past" : "");
    return `<div class="qh ${cls}" style="width:${COLW}px"><span class="q">${qn}Q</span><span class="y">${qn === "1" || gi === firstI ? y : "&nbsp;"}</span></div>`;
  }).join("");
  const bgCells = Array.from({ length: N }, (_, i) =>
    `<div class="cl ${firstI + i < nowI ? "past" : ""}" style="width:${COLW - 6}px"></div>`).join("");
  const nowLeft = (nowI - firstI) * COLW + COLW / 2;

  const body = rows.map(s => {

    const sp = spanOf(s);
    const a = clamp(qOfYM(sp.sy, sp.sm) - firstI, 0, N - 1);
    const b = clamp(qOfYM(sp.ey, sp.em) - firstI, 0, N - 1);
    const left = a * COLW + 3, w = (b - a + 1) * COLW - 6;

    return `<div class="tl-row${isClosed(s) ? " lc-closed" : ""}">

            ${detail ? `<span class="t3">${spanLabel(s)} · 계획 ${c.done}/${c.total} 완료 · ${lq ? pLabel(lq.period) + " 제출" : "실적 없음"}</span>` : ""}
          </span>

      </div>
      <div class="tl-track" style="width:${trackW}px">
        <div class="cellrow">${bgCells}</div>
        <button class="blk esg-${s.esg}${showChip ? " has-chip" : ""}" data-open="${esc(s.id)}" style="left:${left}px;width:${w}px"
          title="${esc(s.title)} · ${spanLabel(s)} · 달성 ${p}% (기대 ${expectedPct(s)}%) · ${st.label}">
          <span class="bmid">${showIcon ? `<span class="bic">${ESG_ICON[s.esg]}</span>` : ""}<span class="bt">${esc(s.title)}</span></span>
          <span class="bar"><i style="width:${p}%"></i></span>
          ${showChip ? `<span class="bchip" style="color:${STATUS_VAR[st.key]}"><span class="d" style="background:${STATUS_VAR[st.key]}"></span>${st.label} ${p}%</span>` : ""}
        </button>
      </div>
    </div>`;
  }).join("");

  const maxH = (opts && opts.maxH) || null;
  return `<div class="tl-wrap" id="tlWrap" data-namew="${nameW}"${maxH ? ` style="max-height:${maxH}"` : ""}><div class="tl">
    <div class="tl-row tl-head">

function restoreTimelineScroll() {
  const w = $("#tlWrap"); if (!w) return;
  if (state.tlScroll != null) w.scrollLeft = state.tlScroll;

    if (line) {
      /* 현재 분기 선을 스티키 과제명 칼럼 오른쪽에 두어야 한다.
         전체 폭 기준으로 계산하면 칼럼 뒤로 숨으므로, 칼럼을 뺀 가시 영역 기준으로 잡는다. */
      const nameW = +(w.dataset.namew || 236);
      const visW = Math.max(120, w.clientWidth - nameW);
      w.scrollLeft = Math.max(0, parseFloat(line.style.left) - nameW - visW * 0.35);

  w.onscroll = () => { state.tlScroll = w.scrollLeft; };
}

const CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>';
function coOpen(id) {
  if (state.openCos === null) { state.openCos = {}; const m = myCoId(); if (m) state.openCos[m] = true; }
  return !!state.openCos[id];
}
/** 계열사 한 칸. inner 는 펼쳤을 때 보일 내용을 만드는 함수 (접혀 있으면 부르지 않는다) */
function coGroup(c, meta, inner) {
  const open = coOpen(c.companyId);
  return `<div class="sgroup">
    <button class="sgh" data-toggleco="${esc(c.companyId)}" aria-expanded="${open}">
      <div class="nm">${CHEV}${esc(c.name)}</div>
      <div class="mt">${meta}</div>
      <div class="pills">${statusPills(c.stc)}</div>
      <div class="rr">
        <div style="flex:1"><div class="track"><i style="width:${barW(c)}%;background:${c.pct >= c.exp ? "var(--ok)" : "var(--warn)"}"></i>${hasOpen(c) ? `<b style="left:${c.exp}%"></b>` : ""}</div></div>
        <span class="pv">${pctText(c)}</span>
      </div>
    </button>
    ${open ? `<div class="sgb">${inner()}</div>` : ""}
  </div>`;
}

/** 계열사별 상세 — 계열사를 누르면 그 팀이 쫙 나온다 */
function groupCo() {
  const cos = coRollup();
  const nOpen = cos.filter(c => coOpen(c.companyId)).length;
  return `<section class="panel">
    <div class="ph"><div><h2>계열사별 현황</h2>
      <div class="sub">${cos.length}개 계열사 · 계열사를 누르면 소속 팀이 펼쳐집니다</div></div>
      <div class="r"><button class="ghost" data-act="${nOpen === cos.length ? "collapseco" : "expandco"}">${nOpen === cos.length ? "모두 접기" : "모두 펼치기"}</button></div></div>
    ${cos.map(c => {
      const teams = teamRollup(c.list);
      return coGroup(c,
        `팀 ${teams.length}개 · 진행 ${c.nOpen}건${c.nClosed ? " · 종결 " + c.nClosed : ""} · 제출 ${c.sub}/${c.nOpen}`,
        () => teams.length ? teams.map(t => `
          <button class="corow" data-drill="${esc(t.key)}">
            <span class="nm">${esc(t.name)}<small>${esc(siteOf(t.list[0]))}</small></span>
            <span class="n">${t.n}</span>
            <span class="n">${t.nOpen}</span>
            <span><span class="track"><i style="width:${barW(t)}%;background:${t.pct >= t.exp ? "var(--ok)" : "var(--warn)"}"></i>${hasOpen(t) ? `<b style="left:${t.exp}%"></b>` : ""}</span></span>
            <span class="n">${t.sub}/${t.nOpen}</span>
          </button>`).join("") : '<p class="help">이 계열사에 등록된 과제가 없습니다.</p>');
    }).join("")}
  </section>`;
}

function dashAll() {
  const all = state.strategies, cq = curQuarter(), f = state.filters;
  const scoped = all.filter(x => coMatch(x, f.company) && siteMatch(x, f.site));
  const scopeName = f.site
    ? (f.site === "__none" ? "사업장 미지정" : (siteNameOf(f.site) || "선택 사업장"))
    : (f.company ? (coNameOf(f.company) || "선택 계열사") : "그룹사 전체");
  const openScoped = scoped.filter(isOpen);
  const nClosed = scoped.length - openScoped.length;
  const overall = avg(openScoped.map(pctOf)), expAvg = avg(openScoped.map(expectedPct));
  const submitted = openScoped.filter(s => submittedThisQuarter(s.id)).length;
  const rate = openScoped.length ? Math.round(submitted / openScoped.length * 100) : 0;
  const stc = countStatus(scoped), attn = stc.warn + stc.risk;
  const rows = scoped.slice().sort(byStatus);
  const at = attnList().filter(x => siteMatch(x, f.site));
  const rolls = teamRollup(scoped);
  const feed = [...state.progress].sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""))[0];
  const dl = deadlineChip(cq);
  const noTeams = teamsWithoutStrategy().filter(x => !f.site || x.team.siteId === f.site);

  return `<section class="panel">
    <div class="ph">
      <div><h2>중장기전략 로드맵</h2>
        <div class="sub">${esc(scopeName)} · ${rows.length}건 · 위험·지연 과제가 위로 정렬됩니다</div></div>
      <div class="r">
        ${coSelect("dCo", f.company)}
        ${siteSelect("dSite")}
        <span class="ghost flat ${dl.cls}" title="${dl.isDefault ? "이 분기 마감일이 지정되지 않았습니다" : "제출 마감 " + dl.date + (dl.setBy ? " · 설정 " + dl.setBy : "")}">
          ${ICO.cal}${cq.replace("-", " ")} ${dl.isDefault ? "마감일 미지정" : dl.md + " · " + dl.txt}</span>
        ${state.canEdit ? '<button class="ghost" data-act="deadline">마감일 설정</button>' : ""}
        <button class="ghost" data-sub="road">자세히 보기</button>
      </div>
    </div>
    ${rows.length ? timelineHtml(rows, { maxH: "44vh" }) + (rows.length > 6 ? `<div class="tl-more">${rows.length}건 — 목록 안에서 위아래로 스크롤됩니다</div>` : "")
      : '<div class="empty"><h3>이 사업장에 등록된 과제가 없습니다</h3><p>상단에서 다른 사업장을 고르거나 전체 사업장으로 돌아가 보세요.</p></div>'}
  </section>

  <div class="grid3">
    <section class="panel">
      <div class="ph"><div><h3>조치 필요</h3><div class="sub">기대치 미달 폭이 큰 순 · 맨 위가 가장 시급합니다</div></div>
        <div class="r"><button class="ghost" data-sub="attn">전체 ${attnList().length}건</button></div></div>
      ${at.length ? `<div class="acards">${at.slice(0, 3).map((x, i) => attnCard(x, i === 0, false)).join("")}</div>`
      : '<p style="color:var(--ok);font-size:13px">조치가 필요한 과제가 없습니다.</p>'}
      ${noTeams.length ? `<div style="margin-top:var(--s3)">
        <div class="help" style="margin-bottom:var(--s1)"><b>과제 미등록 팀 ${noTeams.length}개</b> — 아직 한 건도 올리지 않았습니다</div>
        ${noTeams.slice(0, 5).map(x => `<div class="miss-row"><div>${esc(x.team.name)}<div class="sname">${esc(x.siteName)}</div></div>
          <span class="pill s-none">미등록</span></div>`).join("")}
        ${noTeams.length > 5 ? `<div class="help" style="margin-top:var(--s1)">그 외 ${noTeams.length - 5}개 팀</div>` : ""}</div>` : ""}
    </section>

    <section class="panel">
      <div class="ph"><div><h3>팀별 달성률</h3><div class="sub">${esc(scopeName)} · ${rolls.length}개 팀</div></div>
        <div class="r"><button class="ghost" data-sub="co">계열사별로 보기</button></div></div>
      ${rolls.length ? `<div class="tcards">${rolls.slice(0, 4).map(teamCard).join("")}</div>
        ${rolls.length > 4 ? `<div class="help" style="margin-top:var(--s2)">그 외 ${rolls.length - 4}개 팀 — 사업장별 화면에서 전체 확인</div>` : ""}`
      : '<p class="help">표시할 팀이 없습니다.</p>'}
    </section>

    <section class="panel orb-panel">
      <div class="orb"><div class="on"><span class="v num">${overall}<span style="font-size:20px;color:var(--muted)">%</span></span><span class="k">${esc(scopeName)} 평균</span></div></div>
      <h3>${overall >= expAvg ? "계획대로 진행 중입니다" : "기대치에 미달합니다"}</h3>
      <p class="od">연차별 목표 기준 기대치 <b>${expAvg}%</b> 대비
        <b style="color:${overall >= expAvg ? "var(--ok)" : "var(--risk)"}">${overall - expAvg >= 0 ? "+" : ""}${overall - expAvg}%p</b>.
        ${attn ? `지연·위험 <b>${attn}건</b>이 조치를 기다립니다.` : "조치가 필요한 과제는 없습니다."}</p>
      <div class="ostats">
        <div class="ostat"><div class="k">진행 과제</div><div class="v num">${openScoped.length}<small>건</small></div>${nClosed ? `<div class="k" style="margin-top:2px">종료·중단 ${nClosed}</div>` : ""}</div>
        <div class="ostat"><div class="k">${cq.replace("-", " ")} 제출률</div><div class="v num">${rate}<small>%</small></div></div>
        <div class="ostat ${attn ? "risk" : ""}"><div class="k">조치 필요</div><div class="v num">${attn}<small>건</small></div></div>
      </div>
      <div class="oacts">
        ${state.canEdit ? '<button class="ghost" data-act="new">＋ 전략 등록</button>' : ""}
        <button class="ghost" data-act="printSummary">요약 인쇄</button>
        <button class="ghost" data-act="printForms">과제별 인쇄</button>
        <button class="ghost" data-act="export">CSV</button>
        ${state.canEdit ? '<button class="ghost" data-act="manageOrg">사업장·팀 관리</button>' : ""}
      </div>
      ${feed ? `<div class="help" style="margin-top:var(--s3)">최근 실적 · ${esc(feed.author || "익명")}(${esc(feed.team || "")}) ${pLabel(feed.period)} · ${relTime(feed.updatedAt)}</div>` : ""}
    </section>
  </div>`;
}

/** 사업장 선택 드롭다운 — 본사·각 공장별로 골라 본다 */
function siteSelect(id) {
  const f = state.filters, rolls = siteRollup();
  const opts = sortedSites().map(st => {
    const r = rolls.find(x => x.siteId === st.id);
    return `<option value="${esc(st.id)}" ${f.site === st.id ? "selected" : ""}>${esc(st.name)}${r ? " (" + r.n + ")" : " (0)"}</option>`;
  }).join("");
  const orphan = rolls.find(x => !x.siteId);
  return `<select class="ghost" id="${id}">
    <option value="">전체 사업장 (${state.strategies.length})</option>${opts}${orphan ? `<option value="__none" ${f.site === "__none" ? "selected" : ""}>사업장 미지정 (${orphan.n})</option>` : ""}</select>`;
}

/* --- 로드맵 상세 --- */
function dashRoad() {
  const f = state.filters;
  let rows = state.strategies.filter(x => coMatch(x, f.company) && siteMatch(x, f.site) && (!f.esg || x.esg === f.esg));
  rows = rows.slice().sort(byStatus);
  const stc = countStatus(rows);
  const spanMin = rows.length ? Math.min(...rows.map(s => s.startYear)) : "—";
  const spanMax = rows.length ? Math.max(...rows.map(s => s.endYear)) : "—";
  const sites = siteRollup();
  return `<section class="panel">
    <div class="ph">
      <div><h2>중장기전략 로드맵</h2>
        <div class="sub">추진기간 ${spanMin}–${spanMax} · ${rows.length}건 표시 · 위험·지연 과제가 위로 정렬됩니다</div></div>
      <div class="r">
        ${coSelect("rCo", f.company)}
        ${siteSelect("rSite")}
        <select class="ghost" id="rEsg"><option value="">전체 영역</option>${["E", "S", "G"].map(k => `<option value="${k}" ${f.esg === k ? "selected" : ""}>${ESG_SHORT[k]}</option>`).join("")}</select>
        ${(f.company || f.site || f.esg) ? '<button class="ghost" data-act="clearf">필터 해제</button>' : ""}
      </div>
    </div>
    ${statBoxes([
      ["표시 과제", rows.length + "<small>건</small>"],
      ["평균 달성률", avg(rows.map(pctOf)) + "<small>%</small>"],
      ["기간경과 기대치", avg(rows.map(expectedPct)) + "<small>%</small>"],
      ["정상", stc.ok + "<small>건</small>", "ok"],
      ["지연", stc.warn + "<small>건</small>", "warn"],
      ["위험", stc.risk + "<small>건</small>", "risk"],
      ["완료", stc.done + "<small>건</small>"],
      ["미착수", stc.none + "<small>건</small>"]
    ])}
    ${rows.length ? timelineHtml(rows, { detail: true, maxH: "58vh" })
      : '<div class="empty"><h3>조건에 맞는 과제가 없습니다</h3><p>필터를 해제해 보세요.</p><button class="btn" data-act="clearf">필터 해제</button></div>'}
  </section>`;
}

/* --- 조치 필요 상세 --- */
function dashAttn() {
  const list = attnList(), cq = curQuarter();
  const risk = list.filter(s => statusOf(s).key === "risk").length;
  const warn = list.filter(s => statusOf(s).key === "warn").length;
  const over = state.strategies.filter(s => !submittedThisQuarter(s.id)).length;
  const noReason = list.filter(s => { const l = lastQuarterlyOf(s.id); return !l || !l.delayReason; }).length;
  return `<section class="panel">
    <div class="ph"><div><h2>조치 필요</h2>
      <div class="sub">기대치 미달 폭이 큰 순서입니다 · ${cq.replace("-", " ")} 기준</div></div></div>
    ${statBoxes([
      ["위험", risk + "<small>건</small>", risk ? "risk" : ""],
      ["지연", warn + "<small>건</small>", warn ? "warn" : ""],
      [cq.replace("-", " ") + " 미제출", over + "<small>건</small>", over ? "warn" : ""],
      ["지연사유 미기재", noReason + "<small>건</small>", noReason ? "risk" : ""]
    ])}
    ${list.length ? `<div class="acards">${list.map((s, i) => attnCard(s, i === 0, true)).join("")}</div>`
      : '<div class="empty"><h3>조치가 필요한 과제가 없습니다</h3><p>전 과제가 기간경과 기대치 이상이고, 이번 분기 실적도 모두 제출되었습니다.</p></div>'}
  </section>`;
}

function attnCard(s, hot, detail) {
  const st = statusOf(s), p = pctOf(s), e = expectedPct(s), c = planCounts(s);
  const lq = lastQuarterlyOf(s.id), over = !submittedThisQuarter(s.id);
  const gap = p - e;
  /* 맨 위 카드만 색이 다른 이유를 그 자리에서 밝힌다 — 목록은 기대치 미달 폭이 큰 순이다 */
  const why = gap < 0
    ? `가장 시급 — 기대치보다 ${-gap}%p 뒤처져 있습니다`
    : (over ? "가장 시급 — 이번 분기 실적이 아직 제출되지 않았습니다" : "가장 시급 — 목록 맨 위 과제입니다");
  return `<button class="acard ${hot ? "hot" : ""}" data-open="${esc(s.id)}">
    ${hot ? `<div class="whyhot">${why}</div>` : ""}
    <div class="ah"><div class="at">${esc(s.title)}</div>
      <div class="ab" style="color:${STATUS_VAR[st.key]}"><span style="width:5px;height:5px;border-radius:99px;background:${STATUS_VAR[st.key]}"></span>${st.label}</div></div>
    <div class="ad">${esc(coOf(s))} › ${esc(siteOf(s))} · ${esc(teamOf(s))} · ${esc(s.owner || "담당자 미지정")}${detail ? ` · 추진 ${spanLabel(s)}` : ""}</div>
    <div class="achips">
      <span class="mini"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>달성 <b>${p}%</b> · 기대 <b>${e}%</b> · <b style="color:${gap < 0 ? "var(--risk)" : "var(--ok)"}">${gap >= 0 ? "+" : ""}${gap}%p</b></span>
      ${detail ? `<span class="mini">계획 <b>${c.done}/${c.total}</b> 완료${c.doing ? " · 진행중 " + c.doing : ""}</span>` : ""}
      <span class="mini" ${over ? 'style="color:var(--risk)"' : ""}>${over ? "분기실적 미제출" : pLabel(lq.period) + " 제출"}</span>
    </div>
    ${detail && lq && lq.delayReason ? `<div class="anote"><b>지연 사유 · ${pLabel(lq.period)}</b>${nl2(lq.delayReason)}</div>` : ""}
    ${detail && lq && lq.catchupPlan ? `<div class="anote"><b>Catch-up Plan</b>${nl2(lq.catchupPlan)}</div>` : ""}
    ${detail && (!lq || !lq.delayReason) ? `<div class="anote" style="color:var(--risk)"><b>지연 사유 미기재</b>기대치에 못 미치는데 사유가 없습니다. 담당자에게 요청해 주세요.</div>` : ""}
  </button>`;
}
function statusPills(stc) {
  return [["risk", "위험"], ["warn", "지연"], ["none", "미착수"], ["ok", "정상"], ["done", "완료"], ["closed", "종료"], ["stopped", "중단"]]
    .filter(([k]) => stc[k]).map(([k, l]) => `<span class="pill s-${k}">${l} ${stc[k]}</span>`).join("");
}
function teamCard(t) {
  return `<div class="tcard">
    <div class="tav" style="background:${hueColor(t.name, 30)}">${esc(initials(t.name))}</div>
    <div class="tn" title="${esc(t.name)}">${esc(t.name)}</div>
    <div class="tm">진행 ${t.nOpen}건${t.nClosed ? " · 종료 " + t.nClosed : ""} · 제출 ${t.sub}/${t.nOpen}</div>
    <div class="tp"><span class="num">${pctText(t)}</span>${hasOpen(t) ? `<span style="color:${t.pct >= t.exp ? "var(--ok)" : "var(--risk)"};font-size:10.5px">${t.pct - t.exp >= 0 ? "+" : ""}${t.pct - t.exp}%p</span>` : ""}</div>
    <div class="ttrack"><div class="track"><i style="width:${barW(t)}%;background:${t.pct >= t.exp ? "var(--ok)" : "var(--warn)"}"></i>${hasOpen(t) ? `<b style="left:${t.exp}%"></b>` : ""}</div></div>
  </div>`;
}

/* ============================ 과제 목록 ============================ */

  return banners() + `<section class="panel">
    <div class="ph"><div><h2>과제 목록${["E", "S", "G"].includes(sub) ? " · " + ESG_SHORT[sub] : ""}</h2>
      <div class="sub">${state.strategies.length}건 등록 · ${rows.length}건 표시</div></div></div>
  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="8.8" cy="8.8" r="5.4"/><path d="M12.9 12.9 17 17"/></svg>
      <input type="search" id="fq" placeholder="과제명 · 사업장 · 팀 · 담당자 · KPI 검색" value="${esc(f.q)}">
    </div>
    ${coSelect("fco", f.company)}
    <select class="ghost" id="fsite"><option value="">전체 사업장</option>${sites.map(x => `<option value="${esc(x.siteId)}" ${f.site === x.siteId ? "selected" : ""}>${esc(x.name)} (${x.n})</option>`).join("")}</select>
    <select class="ghost" id="fcat"><option value="">전체 분류</option>${CATS.map(([code, name]) => `<option value="${code}" ${f.cat === code ? "selected" : ""}>${esc(name)}</option>`).join("")}<option value="__none" ${f.cat === "__none" ? "selected" : ""}>분류 미지정</option></select>
    <select class="ghost" id="fteam"><option value="">${f.site ? "사업장 내 전체 팀" : "전체 팀"}</option>${teamOpts.map(t => `<option value="${esc(t.key)}" ${f.team === t.key ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>
    <select class="ghost" id="fstatus"><option value="">전체 상태</option>${[["ok", "정상"], ["warn", "지연"], ["risk", "위험"], ["done", "완료"], ["none", "미착수"]].map(([v, l]) => `<option value="${v}" ${f.status === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    ${(f.q || f.company || f.site || f.team || f.cat || f.status) ? '<button class="ghost" data-act="clearf">필터 해제</button>' : ""}
  </div>
  ${rows.length ? `<div class="list">${rows.map(itemRow).join("")}</div>`
      : (state.strategies.length ? '<div class="empty"><h3>조건에 맞는 과제가 없습니다</h3><p>필터를 해제하거나 검색어를 바꿔 보세요.</p><button class="btn" data-act="clearf">필터 해제</button></div>' : emptyState())}
  </section>`;

function itemRow(s) {

/** 사업장 한 칸 — 그 아래 팀들 */
function orgSiteBlock(name, teams) {
  const rows = teams.map(t => rollup(strategiesOfTeam(t.id), t.name, t.id)).sort((a, b) => b.pct - a.pct);
  const agg = rollup(teams.flatMap(t => strategiesOfTeam(t.id)), name, name);
  return `<div class="orgsite">
    <div class="orgsite-h">${esc(name)}<span>팀 ${teams.length}개 · 진행 ${agg.nOpen}건${agg.nClosed ? " · 종결 " + agg.nClosed : ""}</span>
      <span class="pv">${pctText(agg)}</span></div>
    ${rows.length ? rows.map(orgTeamRow).join("") : '<p class="help">이 사업장에 등록된 팀이 없습니다.</p>'}
  </div>`;
}
