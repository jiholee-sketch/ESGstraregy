/* ============================ 담당팀 전략 (D-039 ~ D-042) ============================ */
/* 담당자가 들어오면 가장 먼저 보는 화면. 우리 팀 과제만 모아 보고, 여기서 추가하고 종결한다.
   로그인이 없으므로 '우리 팀'은 브라우저에 기억시킨 teamId 하나로 정해진다. */

/** 한 팀의 과제. 등록 시점 teamId가 기준이고, 그것이 없는 옛 기록만 팀 이름으로 맞춘다. */
function strategiesOfTeam(id) {
  if (!id || id === "__all") return [];
  const nm = teamNameOf(id) || "";
  return state.strategies.filter(s => s.teamId ? s.teamId === id : (nm && s.team === nm));
}
/** 우리 팀 과제 */
function myStrategies() {
  const id = state.me.teamId;
  if (!id || id === "__all") return [];
  const nm = teamNameOf(id) || state.me.team || "";
  return state.strategies.filter(s => s.teamId ? s.teamId === id : (nm && s.team === nm));
}
/** 지금 보고 있는 계열사. 사무국은 위 드롭다운으로 바꿔 본다. */
function myCoId() {
  if (state.filters.company) return state.filters.company;
  const c = coIdOfTeam(teamRec(state.me.teamId));
  if (c) return c;
  const first = sortedCos()[0];
  return first ? first.id : "";
}

/** 팀 선택을 이 브라우저에 기억시킨다 (D-039) */
function pickTeam(id) {
  state.pickCo = "";
  if (id === "__all") state.me = { ...state.me, teamId: "__all" };
  else {
    const t = teamRec(id);
    if (!t) { toast("팀을 찾지 못했습니다. 새로고침한 뒤 다시 골라 주세요."); return; }
    state.me = { ...state.me, teamId: t.id, team: t.name };
  }
  try { localStorage.setItem("esg.me", JSON.stringify(state.me)); } catch (e) { }
  state.view = id === "__all" ? "group" : "myco";
  state.landed = true;
  render(); window.scrollTo(0, 0);
}

/* ---------------- 팀 고르기 — 계열사 먼저, 그다음 팀 (D-047) ---------------- */
function viewPickTeam() {
  const skip = `<div class="mt-skip"><button class="ghost" data-pick="__all">팀 없이 전체 보기 — 사무국·열람용</button></div>`;

  if (!state.companies.length) return banners() + `<section class="panel mt-pick">
    <div class="ph"><div><h2>어느 팀이신가요?</h2></div></div>
    <div class="empty"><h3>등록된 계열사가 없습니다</h3>
      <p>조직 현황 화면의 <b>조직 관리</b>에서 계열사와 팀을 먼저 등록해 주세요.</p></div>${skip}</section>`;

  /* 1단계 — 계열사 */
  if (!state.pickCo) {
    const cos = sortedCos();
    return banners() + `<section class="panel mt-pick">
      <div class="ph"><div><h2>어느 계열사이신가요?</h2>
        <div class="sub">계열사를 고르면 그 안의 팀이 나옵니다. 고른 값은 이 브라우저에만 저장되고 언제든 바꿀 수 있습니다.</div></div></div>
      <div class="mt-cos">${cos.map(c => {
        const nt = teamsOfCo(c.id).length;
        const ns = state.strategies.filter(s => coIdOf(s) === c.id && isOpen(s)).length;
        return `<button data-pickco="${esc(c.id)}">${esc(c.name)}<span class="c">팀 ${nt}개 · 진행 과제 ${ns}건</span></button>`;
      }).join("")}</div>${skip}</section>`;
  }

  /* 2단계 — 그 계열사의 팀 */
  const co = coRec(state.pickCo);
  if (!co) { state.pickCo = ""; return viewPickTeam(); }
  const nOpen = id => state.strategies.filter(s => s.teamId === id && isOpen(s)).length;
  const btn = t => `<button data-pick="${esc(t.id)}">${esc(t.name)}<span class="c">진행 과제 ${nOpen(t.id)}건</span></button>`;
  const grp = (title, list) => list.length
    ? `<div class="mt-pickg"><h3>${esc(title)}</h3><div class="mt-teams">${list.slice()
      .sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko")).map(btn).join("")}</div></div>`
    : "";
  const blocks = sitesOfCo(co.id).map(st => grp(st.name, state.teams.filter(t => t.siteId === st.id))).join("")
    + grp(sitesOfCo(co.id).length ? "계열사 직속" : "소속 팀", looseTeamsOfCo(co.id));

  return banners() + `<section class="panel mt-pick">
    <div class="ph"><div><h2>${esc(co.name)} — 어느 팀이신가요?</h2>
      <div class="sub">고르면 다음부터 우리 팀 과제 화면이 먼저 열립니다.</div></div>
      <div class="r"><button class="ghost" data-act="backco">‹ 계열사 다시 고르기</button></div></div>
    ${teamsOfCo(co.id).length ? blocks : `<div class="empty"><h3>이 계열사에 등록된 팀이 없습니다</h3>
      <p>조직 현황 화면의 <b>조직 관리</b>에서 팀을 먼저 등록해 주세요.</p>
      <button class="btn" data-act="backco">다른 계열사 고르기</button></div>`}
    ${skip}
  </section>`;
}

/* ---------------- 담당팀 전략 ---------------- */
/* ============================ 탭2 · 소속 계열사 (D-044 · D-045) ============================ */
function viewMyCo() {
  const co = coRec(myCoId());
  if (!co) return banners() + `<section class="panel">
    <div class="ph"><div><h2>소속 계열사</h2><div class="sub">아직 계열사가 등록되지 않았습니다.</div></div></div>
    <div class="empty"><h3>계열사를 먼저 등록해 주세요</h3>
      <p>조직 현황 화면의 <b>조직 관리</b>에서 계열사를 만들고, 그 아래에 사업장과 팀을 넣습니다.</p>
      ${state.canEdit ? '<button class="btn btn-primary" data-act="manageOrg">조직 관리 열기</button>' : ""}</div></section>`;

  const head = coHead(co);

  /* 팀 하나를 눌러 들어온 상태 (D-045) */
  if (state.drillTeam) {
    const t = teamRec(state.drillTeam);
    if (t) return banners() + head
      + `<div class="drillback"><button class="ghost" data-act="undrill">‹ ${esc(co.name)} 전체로 돌아가기</button></div>`
      + teamPanel(t.id, t.id === state.me.teamId);
    state.drillTeam = null;
  }

  const sub = subOf();
  if (sub === "site") return banners() + head + coSites(co);
  if (sub === "team") return banners() + head + coTeams(co);

  const mine = teamRec(state.me.teamId);
  if (!mine) return banners() + head + `<section class="panel">
    <div class="empty"><h3>소속 팀이 정해지지 않았습니다</h3>
      <p>어느 팀인지 고르면 이 자리에 우리 팀 과제와 이번 분기 할 일이 표시됩니다.
        사무국이라면 위 탭의 <b>사업장별</b>·<b>팀 전체</b>로 계열사 현황을 보실 수 있습니다.</p>
      <button class="btn btn-primary" data-act="pickteam">팀 고르기</button></div></section>`;
  if (coIdOfTeam(mine) !== co.id) return banners() + head + coTeams(co);
  return banners() + head + teamPanel(mine.id, true);
}

/** 계열사 머리 — 어느 계열사를 보는지, 그 계열사가 지금 어떤 상태인지 */
function coHead(co) {
  const all = state.strategies.filter(s => coIdOf(s) === co.id);
  const open = all.filter(isOpen);
  const r = rollup(all, co.name, co.id);
  const cq = curQuarter(), dl = deadlineChip(cq);
  const unsub = open.filter(s => !submittedThisQuarter(s.id)).length;
  const gap = hasOpen(r) ? r.pct - r.exp : 0;
  const attn = all.filter(isOpen).filter(s => ["risk", "warn"].includes(statusOf(s).key)).length;
  const cos = coRollup();

  return `<section class="panel" style="padding-bottom:var(--s4)">
    <div class="mt-head">
      <div>
        <div class="nm">${esc(co.name)}</div>
        <div class="st">팀 ${teamsOfCo(co.id).length}개 · 진행 ${r.nOpen}건${r.nClosed ? " · 종결 " + r.nClosed + "건" : ""}</div>
      </div>
      <div class="sp"></div>
      ${cos.length > 1 ? `<select class="ghost" id="mCo" aria-label="계열사 선택">${cos.filter(x => x.companyId).map(x =>
        `<option value="${esc(x.companyId)}" ${x.companyId === co.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>` : ""}
      <button class="ghost" data-act="pickteam">내 팀 바꾸기</button>
      ${state.canEdit ? `<button class="pillbtn dark" data-act="new"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10 4.4v11.2M4.4 10h11.2"/></svg>과제 추가</button>` : ""}
    </div>
    ${statBoxes([
      ["이번 분기 제출", r.nOpen ? (r.nOpen - unsub) + "<small>/" + r.nOpen + "건</small>" : "—", unsub ? (dl.n < 0 ? "risk" : "warn") : "ok",
        dl.isDefault ? "마감일 미지정" : pLabel(cq) + " " + dl.txt],
      ["계열사 평균", pctText(r).replace("%", "<small>%</small>"), "", hasOpen(r) ? "기대치 " + r.exp + "%" : ""],
      ["목표 대비", hasOpen(r) ? (gap >= 0 ? "+" : "") + gap + "<small>%p</small>" : "—", !hasOpen(r) ? "" : (gap >= 0 ? "ok" : (gap < -20 ? "risk" : "warn"))],
      ["조치 필요", attn + "<small>건</small>", attn ? "risk" : "", "지연 · 위험"]
    ])}
  </section>`;
}

/** 계열사 안 사업장 → 팀. 팀 행을 누르면 그 팀으로 들어간다 */
function coSites(co) {
  const sites = sitesOfCo(co.id), loose = looseTeamsOfCo(co.id);
  const blocks = sites.map(st => coBlock(st.name, state.teams.filter(t => t.siteId === st.id)))
    .concat(loose.length ? [coBlock("계열사 직속 (사업장 없음)", loose)] : []);
  return `<section class="panel">
    <div class="ph"><div><h3>사업장별 현황</h3>
      <div class="sub">${sites.length}개 사업장${loose.length ? " + 직속 " + loose.length + "개 팀" : ""} · 팀을 누르면 그 팀 과제로 들어갑니다</div></div></div>
    ${blocks.join("") || '<div class="empty"><h3>이 계열사에 사업장·팀이 없습니다</h3><p>조직 관리에서 먼저 등록해 주세요.</p></div>'}
  </section>`;
}
function coBlock(name, teams) {
  if (!teams.length) return "";
  const rows = teams.map(t => rollup(strategiesOfTeam(t.id), t.name, t.id)).sort((a, b) => b.pct - a.pct);
  const agg = rollup(teams.flatMap(t => strategiesOfTeam(t.id)), name, name);
  return `<div class="sgroup">
    <div class="sgh">
      <div class="nm">${esc(name)}</div>
      <div class="mt">팀 ${teams.length}개 · 진행 ${agg.nOpen}건${agg.nClosed ? " · 종결 " + agg.nClosed : ""}</div>
      <div class="rr">
        <div style="flex:1"><div class="track"><i style="width:${barW(agg)}%;background:${agg.pct >= agg.exp ? "var(--ok)" : "var(--warn)"}"></i>${hasOpen(agg) ? `<b style="left:${agg.exp}%"></b>` : ""}</div></div>
        <span class="pv">${pctText(agg)}</span>
      </div>
    </div>
    <div class="sgb">${rows.map(teamDrillRow).join("")}</div>
  </div>`;
}
/** 계열사 안 팀을 한 줄로 */
function coTeams(co) {
  const rows = teamsOfCo(co.id).map(t => rollup(strategiesOfTeam(t.id), t.name, t.id)).sort((a, b) => b.pct - a.pct);
  return `<section class="panel">
    <div class="ph"><div><h3>팀 전체</h3>
      <div class="sub">${rows.length}개 팀 · 달성률 높은 순 · 팀을 누르면 그 팀 과제로 들어갑니다</div></div></div>
    ${rows.length ? `<div class="cotable">
      <div class="corow h"><span>팀</span><span class="n">과제</span><span class="n">진행</span><span>달성 / 기대</span><span class="n">제출</span></div>
      ${rows.map(teamDrillRow).join("")}</div>`
      : '<div class="empty"><h3>이 계열사에 등록된 팀이 없습니다</h3><p>조직 관리에서 먼저 등록해 주세요.</p></div>'}
  </section>`;
}
function teamDrillRow(t) {
  const mine = t.key === state.me.teamId;
  const site = t.list.length ? siteOf(t.list[0]) : (siteNameOf((teamRec(t.key) || {}).siteId) || "사업장 없음");
  return `<button class="corow" data-drill="${esc(t.key)}">
    <span class="nm">${esc(t.name)}${mine ? ' <span class="pill s-carry">우리 팀</span>' : ""}<small>${esc(site)}</small></span>
    <span class="n">${t.n}</span>
    <span class="n">${t.nOpen}</span>
    <span><span class="track"><i style="width:${barW(t)}%;background:${t.pct >= t.exp ? "var(--ok)" : "var(--warn)"}"></i>${hasOpen(t) ? `<b style="left:${t.exp}%"></b>` : ""}</span></span>
    <span class="n">${t.sub}/${t.nOpen}</span>
  </button>`;
}

/** 팀 한 곳의 과제 카드 화면. 우리 팀이든 남의 팀이든 같은 렌더러를 쓴다 (D-045) */
function teamPanel(teamId, isMine) {
  const t = teamRec(teamId);
  if (!t) return "";
  const all = strategiesOfTeam(teamId), open = all.filter(isOpen), closed = all.filter(isClosed);
  const cq = curQuarter(), dl = deadlineChip(cq);
  const unsub = open.filter(s => !submittedThisQuarter(s.id));
  const r = rollup(all, t.name, t.id);
  const gap = hasOpen(r) ? r.pct - r.exp : 0;
  const sub = state.teamSub || "all";

  let rows;
  if (sub === "done") rows = closed.slice().sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
  else {
    rows = sub === "todo"
      ? open.filter(s => !submittedThisQuarter(s.id) || ["risk", "warn"].includes(statusOf(s).key))
      : open.slice();
    /* 급한 것이 위로 — 미제출을 먼저, 그다음 기대치보다 많이 뒤처진 순 */
    const urg = s => (submittedThisQuarter(s.id) ? 1000 : 0) + (pctOf(s) - expectedPct(s));
    rows.sort((a, b) => urg(a) - urg(b));
  }

  const nTodo = open.filter(s => !submittedThisQuarter(s.id) || ["risk", "warn"].includes(statusOf(s).key)).length;
  const chip = (k, label, n) => `<button class="ghost${sub === k ? " warn" : ""}" data-act="teamsub" data-id="${k}">${label}${n != null ? " " + n : ""}</button>`;

  const subCls = !open.length ? "" : (unsub.length ? (dl.n < 0 ? "risk" : "warn") : "ok");
  const gapCls = !hasOpen(r) ? "" : (gap >= 0 ? "ok" : (gap < -20 ? "risk" : "warn"));

  return `<section class="panel">
    <div class="mt-head">
      <div>
        <div class="nm">${esc(t.name)}${isMine ? ' <span class="pill s-carry">우리 팀</span>' : ""}</div>
        <div class="st">${t.siteId ? esc(siteNameOf(t.siteId)) + " · " : ""}진행 ${open.length}건${closed.length ? " · 종결 " + closed.length + "건" : ""}</div>
      </div>
      <div class="sp"></div>
      ${chip("all", "전체", open.length)}${chip("todo", "이번 분기 할 일", nTodo)}${chip("done", "종결", closed.length)}
    </div>
    ${statBoxes([
      ["이번 분기 제출", open.length ? (open.length - unsub.length) + "<small>/" + open.length + "건</small>" : "—", subCls],
      [pLabel(cq) + " 마감", dl.isDefault ? "미지정" : dl.txt.replace("마감 ", "") + "<small> · " + dl.md + "</small>", dl.cls],
      ["팀 평균 달성률", pctText(r).replace("%", "<small>%</small>")],
      ["목표 대비", hasOpen(r) ? (gap >= 0 ? "+" : "") + gap + "<small>%p</small>" : "—", gapCls]
    ])}
    ${rows.length ? `<div class="mtcards">${rows.map(myCard).join("")}</div>` : myEmpty(sub, all.length)}
  </section>`;
}

function myEmpty(sub, total) {
  if (sub === "done") return `<div class="empty"><h3>종결한 과제가 없습니다</h3>
    <p>완료했거나 중단한 과제가 여기에 모입니다. 집계에서는 빠지지만 기록은 남습니다.</p></div>`;
  if (sub === "todo") return `<div class="empty"><h3>이번 분기에 할 일이 없습니다</h3>
    <p>실적을 모두 제출했고 지연·위험으로 표시된 과제도 없습니다.</p></div>`;
  if (total) return `<div class="empty"><h3>진행 중인 과제가 없습니다</h3>
    <p>지난 과제는 <b>종결</b> 탭에서 볼 수 있습니다.</p></div>`;
  return `<div class="empty"><h3>아직 등록한 과제가 없습니다</h3>
    <p>우리 팀의 ESG 중장기 실행과제를 등록해 주세요. 한 번 등록하면 다음부터는 분기마다 진행도만 입력하면 됩니다.</p>
    ${state.canEdit ? `<button class="btn btn-primary" data-act="new">첫 과제 등록하기</button>` : ""}</div>`;
}

/** 과제 한 건 — 네 가지를 한 카드에 담는다: 제출 여부 · 진행 상태 · 목표 대비 · 계획 체크 */
function myCard(s) {
  const st = statusOf(s), p = pctOf(s), e = expectedPct(s), c = planCounts(s);
  const cq = curQuarter(), done = submittedThisQuarter(s.id), lq = lastQuarterlyOf(s.id);
  const closed = isClosed(s), gap = p - e;
  const gapCls = gap >= 0 ? "ok" : (gap < -20 ? "risk" : "warn");
  const qTxt = closed ? (s.lifecycle === "stopped" ? "중단됨" : "종료됨")
    : (done ? pLabel(lq ? lq.period : cq) + " 제출" : "아직 미제출");
  const acts = !state.canEdit ? "" : (closed
    ? `<div class="mtc-a"><button class="ghost" data-act="reopen" data-id="${esc(s.id)}">진행으로 되돌리기</button></div>`
    : `<div class="mtc-a">
        <button class="ghost" data-act="report" data-id="${esc(s.id)}">${done ? "실적 수정" : "실적 입력"}</button>
        <button class="ghost" data-act="edit" data-id="${esc(s.id)}">과제 수정</button>
        <button class="ghost" data-act="close" data-id="${esc(s.id)}">과제 종결</button>
      </div>`);

  return `<article class="mtc ${closed ? "closed" : (done ? "" : "overdue")}">
    <div class="mtc-t">
      <button class="ttl" data-open="${esc(s.id)}">${esc(s.title)}</button>
      <span class="pill ${st.cls}">${st.label}</span>
    </div>
    <div class="mtc-m">
      <span class="tag"><span class="dot dot-${s.esg}"></span>${ESG_SHORT[s.esg]}</span>
      ${catOf(s) ? `<span class="tag"><span class="dot" style="background:${CAT_COLOR[catOf(s)]}"></span>${esc(CAT_NAME[catOf(s)])}</span>` : ""}
      <span>${esc(s.owner || "담당자 미지정")}</span>
      <span class="sep">·</span><span class="num">${spanLabel(s)}</span>
      ${carryCount(s) ? `<span class="pill s-carry">이월 ${carryCount(s)}회</span>` : ""}
    </div>
    <div class="mtc-g">
      <div class="mtq"><div class="k">이번 분기 실적</div>
        <div class="v ${closed ? "" : (done ? "ok" : "warn")}">${qTxt}</div></div>
      <div class="mtq"><div class="k">달성률 / 기대</div>
        <div class="v">${p}% / ${e}%</div>
        <div class="track"><i style="width:${p}%;background:${p >= e ? "var(--ok)" : "var(--warn)"}"></i><b style="left:${e}%"></b></div></div>
      <div class="mtq"><div class="k">목표 대비</div>
        <div class="v ${gapCls}">${gap >= 0 ? "+" + gap + "%p 앞섬" : gap + "%p 뒤처짐"}</div></div>
      <div class="mtq"><div class="k">계획 항목</div>
        <div class="v">${c.total}개 중 ${c.done}개 완료${c.doing ? " · 진행중 " + c.doing : ""}</div></div>
    </div>
    ${acts}
  </article>`;
}

/* ============================ events ============================ */
function bind(root) {
  root.querySelectorAll("[data-open]").forEach(el => el.onclick = () => {
    if (state.view !== "detail") state.backTo = state.view;
    state.selected = el.dataset.open; state.view = "detail"; render(); window.scrollTo(0, 0);
  });
  root.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => pickTeam(el.dataset.pick));
  root.querySelectorAll("[data-pickco]").forEach(el => el.onclick = () => {
    state.pickCo = el.dataset.pickco; render(); window.scrollTo(0, 0);
  });
  /* 계열사 아코디언 여닫기 */
  root.querySelectorAll("[data-toggleco]").forEach(el => el.onclick = () => {
    const id = el.dataset.toggleco;
    coOpen(id);                       /* openCos 초기화를 보장한다 */
    state.openCos[id] = !state.openCos[id];
    render();
  });
  /* 계열사 행 → 그 계열사의 소속 화면으로 (D-044) */
  root.querySelectorAll("[data-co]").forEach(el => el.onclick = () => {
    state.filters.company = el.dataset.co; state.filters.site = ""; state.filters.team = "";
    state.drillTeam = null; state.view = "myco"; state.sub.myco = "site";
    render(); window.scrollTo(0, 0);
  });
  /* 팀 행 → 그 팀 과제로 (D-045) */
  root.querySelectorAll("[data-drill]").forEach(el => el.onclick = () => {
    const id = el.dataset.drill;
    if (!teamRec(id)) { toast("이 팀은 조직에 등록돼 있지 않아 열 수 없습니다."); return; }
    state.drillTeam = id; state.teamSub = "all"; state.view = "myco";
    render(); window.scrollTo(0, 0);
  });
  const mco = root.querySelector("#mCo");
  if (mco) mco.onchange = () => {
    state.filters.company = mco.value; state.drillTeam = null; render(); window.scrollTo(0, 0);
  };
  root.querySelectorAll("[data-toggle]").forEach(el => el.onclick = () => togglePlan(state.selected, +el.dataset.toggle));
  root.querySelectorAll("[data-sub]").forEach(el => el.onclick = () => setSub(el.dataset.sub));
  root.querySelectorAll("[data-act]").forEach(el => el.onclick = () => {
    const a = el.dataset.act, id = el.dataset.id;
    if (a === "new") openStrategyForm(null);
    if (a === "edit") openStrategyForm(state.strategies.find(s => s.id === id));
    if (a === "report") openProgressForm(id);
    if (a === "delete") removeStrategy(id);
    if (a === "manageOrg") openOrgForm();
    if (a === "export") exportCsv();
    if (a === "deadline") openDeadlineForm();
    if (a === "close") openCloseForm(id);
    if (a === "reopen") reopenStrategy(id);
    if (a === "printSummary") printSummary();
    if (a === "printForms") printForms();
    if (a === "pickteam") { state.view = "pick"; render(); window.scrollTo(0, 0); }
    if (a === "undrill") { state.drillTeam = null; state.sub.myco = "site"; render(); window.scrollTo(0, 0); }
    if (a === "backco") { state.pickCo = ""; render(); window.scrollTo(0, 0); }
    if (a === "expandco") { state.openCos = {}; state.companies.forEach(c => state.openCos[c.id] = true); state.openCos[""] = true; render(); }
    if (a === "collapseco") { state.openCos = {}; render(); }
    if (a === "teamsub") { state.teamSub = id; render(); }
    if (a === "clearf") { state.filters = { q: "", company: "", site: "", team: "", esg: "", cat: "", status: "" }; render(); }
  });
  const fq = root.querySelector("#fq");
  if (fq) fq.oninput = () => {
    state.filters.q = fq.value; const p = fq.selectionStart; render();
    const n = $("#fq"); if (n) { n.focus(); n.setSelectionRange(p, p); }
  };
  [["fsite", "site"], ["fteam", "team"], ["fstatus", "status"], ["fco", "company"], ["fcat", "cat"],
   ["rSite", "site"], ["rEsg", "esg"], ["rCo", "company"], ["dSite", "site"], ["dCo", "company"]].forEach(([sel, key]) => {
    const el = root.querySelector("#" + sel);
    if (el) el.onchange = () => {
      state.filters[key] = el.value;
      if (key === "site") { state.filters.team = ""; state.tlScroll = null; }
      if (key === "company") { state.filters.site = ""; state.filters.team = ""; state.tlScroll = null; }
      render();
    };
  });
}
function setSub(k) { state.sub[state.view] = k; state.tlScroll = null; render(); window.scrollTo(0, 0); }
document.querySelectorAll("#rail .ricon[data-view]").forEach(b => b.onclick = () => {
  state.view = b.dataset.view; state.selected = null; state.tlScroll = null; render(); window.scrollTo(0, 0);
});
$("#subtabs").onclick = e => {
  const t = e.target.closest("[data-sub],[data-goback]"); if (!t) return;
  if (t.dataset.goback) { state.view = state.backTo || "list"; state.selected = null; render(); return; }
  setSub(t.dataset.sub);
};
$("#setMe").onclick = () => openMeForm();
$("#topNew").onclick = () => openStrategyForm(null);
$("#topCsv").onclick = () => exportCsv();
$("#topSearch").onclick = () => {
  state.view = "list"; state.selected = null; render();
  const n = $("#fq"); if (n) n.focus();
};

async function togglePlan(sid, i) {
  const s = state.strategies.find(x => x.id === sid); if (!s || !state.canEdit) return;
  const plans = plansOf(s); if (!plans[i]) return;
  const now = new Date().toISOString();
  plans[i] = { ...plans[i], status: ST_ORDER[(ST_ORDER.indexOf(plans[i].status) + 1) % 3], updatedBy: state.me.name || "익명", updatedAt: now };
  try { await save("strategies/" + sid, { plans, updatedAt: now }, "update"); }
  catch (e) { toast(writeError(e)); }
}

/* ============================ dialogs ============================ */
const dlg = $("#dlg");
function openDialog(html, onSubmit) {
  dlg.innerHTML = `<form method="dialog" id="dlgForm">${html}</form>`;
  const form = $("#dlgForm");
  form.querySelectorAll("[data-close]").forEach(b => b.onclick = e => { e.preventDefault(); dlg.close(); });
  form.onsubmit = e => {
    if (e.submitter && e.submitter.dataset.close !== undefined) return;
    e.preventDefault(); onSubmit(form);
  };
  dlg.showModal();
  const first = form.querySelector("input:not([disabled]),select:not([disabled]),textarea"); if (first) first.focus();
  return form;
}

function openMeForm(after) {
  const teams = state.teams.slice().sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko"));
  /* 팀 고르기(D-039)에서 이미 정해졌으면 다시 묻지 않는다. 남은 건 이름뿐이다. */
  const known = teamRec(state.me.teamId);
  const teamField = known
    ? `<div class="field"><label>소속 팀</label>
        <div class="mt-known"><b>${esc(known.name)}</b>${known.siteId ? `<span class="s">${esc(siteNameOf(known.siteId))}</span>` : ""}
          <button type="button" class="ghost" data-changeteam="1">팀 바꾸기</button></div>
        <input type="hidden" id="mTeam" value="${esc(known.id)}"></div>`
    : `<div class="field"><label for="mTeam">소속 팀<span class="req">*</span></label>
        ${teams.length
      ? `<select id="mTeam" required><option value="">선택하세요</option>${teams.map(t => `<option value="${esc(t.id)}" ${t.id === state.me.teamId ? "selected" : ""}>${esc(t.name)}${t.siteId ? " (" + esc(siteNameOf(t.siteId)) + ")" : ""}</option>`).join("")}</select>`
      : `<input type="text" id="mTeam" required value="${esc(state.me.team)}" placeholder="예: 품질경영팀">
           <span class="help">등록된 팀이 없습니다. 사업장·팀 관리에서 먼저 등록하면 선택형으로 바뀝니다.</span>`}
      </div>`;

  const meForm = openDialog(`
    <div class="dlg-h"><div><h2>${known ? "이름을 알려주세요" : "작성자 설정"}</h2><p>${known
      ? "실적과 수정 내역에 작성자로 남습니다. 한 번만 입력하면 됩니다. 이 브라우저에만 저장됩니다."
      : "실적을 등록한 팀과 담당자를 기록하는 데 사용됩니다. 이 브라우저에만 저장됩니다."}</p></div>
    <button class="x" data-close type="button" aria-label="닫기">×</button></div>
    <div class="dlg-b"><div class="${known ? "" : "row2"}">

        <input type="text" id="mName" required value="${esc(state.me.name)}" placeholder="예: 김이현"></div>
    </div></div>

    form => {
      const tv = form.mTeam.value.trim(), trec = teamRec(tv);
      state.me = {
        teamId: trec ? trec.id : (state.me.teamId || ""),
        team: trec ? trec.name : tv.replace(/\s*\([^)]*\)$/, ""),
        name: form.mName.value.trim()
      };
      try { localStorage.setItem("esg.me", JSON.stringify(state.me)); } catch (e) { }
      dlg.close(); render(); if (after) after();
    });

  const chg = meForm.querySelector("[data-changeteam]");
  if (chg) chg.onclick = () => { dlg.close(); state.view = "pick"; render(); window.scrollTo(0, 0); };

    const companyId = direct ? pick.slice(3) : ((siteRec(pick) || {}).companyId || null);
    /* 같은 이름은 계열사 안에서만 막는다 (D-016 수정) — 인사팀은 계열사마다 있다 */

    if (!name) return show("사업장 이름은 비워둘 수 없습니다.");
    if (name === st.name) return toast("변경된 내용이 없습니다.");
    if (state.sites.some(x => x.id !== st.id && normName(x.name) === normName(name))) return show("이미 같은 사업장이 있습니다.");
    const companyId = (form.querySelector('[data-sco="' + st.id + '"]') || {}).value || null;
    try { await save("sites/" + st.id, { name, companyId, updatedAt: new Date().toISOString() }, "update"); reopen("사업장 정보를 수정했습니다."); }
    catch (e) { fail(e); }
  });
  form.querySelectorAll("[data-sdel]").forEach(b => b.onclick = async () => {
    const st = siteRec(b.dataset.sdel); if (!st) return;
    try { await state.db.doc("sites/" + st.id).delete(); reopen("'" + st.name + "' 사업장을 삭제했습니다."); }
    catch (e) { fail(e); }
  });
  form.querySelectorAll("[data-trename]").forEach(b => b.onclick = async () => {
    const t = teamRec(b.dataset.trename); if (!t) return;
    const name = (form.querySelector('[data-tname="' + t.id + '"]').value || "").trim();
    const siteId = form.querySelector('[data-tsite="' + t.id + '"]').value;
    if (!name) return show("팀 이름은 비워둘 수 없습니다.");
    const newCo = (siteRec(siteId) || {}).companyId || t.companyId || null;
    if (state.teams.some(x => x.id !== t.id && coIdOfTeam(x) === newCo && normName(x.name) === normName(name)))
      return show("이 계열사에 이미 같은 팀이 있습니다.");
    if (name === t.name && siteId === (t.siteId || "")) return toast("변경된 내용이 없습니다.");
    const companyId = (siteRec(siteId) || {}).companyId || t.companyId || null;
    try { await save("teams/" + t.id, { name, siteId: siteId || null, companyId, updatedAt: new Date().toISOString() }, "update"); reopen("팀 정보를 수정했습니다."); }
    catch (e) { fail(e); }
  });
  form.querySelectorAll("[data-tdel]").forEach(b => b.onclick = async () => {
    const t = teamRec(b.dataset.tdel); if (!t) return;
    try { await state.db.doc("teams/" + t.id).delete(); reopen("'" + t.name + "' 팀을 삭제했습니다."); }
    catch (e) { fail(e); }
  });
}

      <fieldset class="fieldset"><legend>계획(목표) — 달성률의 근거</legend>
        <div class="help" style="margin-bottom:calc(-1 * var(--s1))">달성률 = <b>(완료 항목 + 진행중 항목 × 0.5) ÷ 전체 항목</b>. 아래 <b>줄 수가 분모</b>이므로, 이 칸을 어떻게 쓰는지가 숫자를 좌우합니다.</div>

            &nbsp;&nbsp;· <b>추상적으로 쓰기</b>('인증 추진', '체계 구축') — 언제 완료로 볼지 알 수 없어 체크를 못 넘깁니다.<br>

            <span class="help">숫자로 세어지는 것. <b style="color:var(--ok)">⭕ EPD 인증 취득 제품 수</b> / <b style="color:var(--risk)">❌ 환경 개선</b></span></div>
          <div class="field"><label for="fKpiUnit">단위</label>
            <input type="text" id="fKpiUnit" maxlength="16" value="${s ? esc(s.kpiUnit || "") : ""}" placeholder="예: 건, %, tCO2e"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="fKpiBase">기준값 (Baseline)</label>
            <input type="number" step="any" id="fKpiBase" value="${s && s.kpiBase != null ? esc(s.kpiBase) : ""}">
            <span class="help">출발점이 되는 값. 배출량·재해율처럼 <b>낮출수록 좋은 지표</b>는 이 값이 있어야 달성률이 제대로 계산됩니다.</span></div>
          <div class="field"><label for="fKpiBaseYear">기준연도</label>
            <input type="number" id="fKpiBaseYear" min="2000" max="2050" value="${s && s.kpiBaseYear ? esc(s.kpiBaseYear) : ""}" placeholder="예: 2024">
            <span class="help">기준값이 <b>몇 년도 수치인지</b>. 연도 없는 기준값은 공시·평가에서 유효한 목표로 인정되지 않고, 해마다 슬그머니 재정의될 수 있습니다.</span></div>
          <div class="field"><label for="fKpiTarget">목표값<span class="help"> — 기준값과 함께 넣으면 배출량·재해율처럼 낮출수록 좋은 지표도 달성률이 계산됩니다.</span></label>
            <input type="number" step="any" id="fKpiTarget" value="${s && s.kpiTarget != null ? esc(s.kpiTarget) : ""}"></div>

    <div class="dlg-f"><button class="btn" data-close type="button">취소</button>
    <button class="btn btn-primary" type="submit">${s ? "수정 저장" : "등록"}</button></div>`,
    async form2 => {
      const err = $("#fErr");
      const A = parseYM(form2.fStart.value), B = parseYM(form2.fEnd.value);
      if (!A || !B) { err.hidden = false; err.textContent = "추진 시작과 목표 완료를 연·월로 입력해 주세요."; return; }
      const sy = A.y, ey = B.y;
      if (B.y * 12 + B.m < A.y * 12 + A.m) { err.hidden = false; err.textContent = "목표 완료가 추진 시작보다 빠를 수 없습니다."; return; }
      if (!form2.fTeam.value) { err.hidden = false; err.textContent = "사업장과 팀을 선택해 주세요."; return; }
      const scopeVal = form2.fSite.value === "__company" ? "company" : "site";
      const pickedTeam = teamRec(form2.fTeam.value);
      const texts = form2.fPlans.value.split("\n").map(x => x.replace(/^[-·•*\s]+/, "").trim()).filter(Boolean);
      if (!texts.length) { err.hidden = false; err.textContent = "달성률은 계획 항목으로 계산합니다. 세부 계획을 한 줄 이상 입력해 주세요."; return; }
      const prev = new Map(plans.map(pp => [pp.text, pp.status]));
      const prevMeta = new Map(plans.map(pp => [pp.text, { by: pp.updatedBy || "", at: pp.updatedAt || "" }]));
      /* 연차별 목표 수집 — 줄어드는 값은 막는다 */
      const yt = {}; let last = -1, bad = "";
      form2.querySelectorAll("[data-yt]").forEach(el => {
        const v = clamp(Math.round(+el.value || 0), 0, 100);
        yt[el.dataset.yt] = v;
        if (v < last) bad = el.dataset.yt;
        last = v;
      });
      if (bad) { err.hidden = false; err.textContent = "연차별 누적 목표는 줄어들 수 없습니다 — " + bad + "년 값을 확인해 주세요."; return; }
      const body = {
        title: form2.fTitle.value.trim(), esg: form2.fEsg.value,
        teamId: form2.fTeam.value, team: teamNameOf(form2.fTeam.value),
        scope: scopeVal,
        category: form2.fCat ? form2.fCat.value : (s ? s.category || "" : ""),
        /* 사업장·계열사를 과제에 굳혀 둔다 — 팀이 나중에 옮겨가도 과거 집계가 흔들리지 않게 (D-030 · D-044) */
        siteId: scopeVal === "company" ? null : ((pickedTeam && pickedTeam.siteId) || null),
        companyId: coIdOfTeam(pickedTeam) || null,
        owner: form2.fOwner.value.trim(),
        startYear: A.y, startMonth: A.m, endYear: B.y, endMonth: B.m,
        priority: form2.fPri.value,
        purpose: form2.fPurpose.value.trim(),
        plans: texts.map(t => ({ text: t, status: prev.get(t) || "todo", updatedBy: prevMeta.get(t) ? prevMeta.get(t).by : "", updatedAt: prevMeta.get(t) ? prevMeta.get(t).at : "" })),
        yearTargets: yt,
        kpiName: form2.fKpiName.value.trim(), kpiUnit: form2.fKpiUnit.value.trim(),
        kpiBase: form2.fKpiBase.value === "" ? null : +form2.fKpiBase.value,
        kpiBaseYear: form2.fKpiBaseYear.value === "" ? null : +form2.fKpiBaseYear.value,
        kpiTarget: form2.fKpiTarget.value === "" ? null : +form2.fKpiTarget.value,
        updatedAt: new Date().toISOString(),
        createdBy: s ? s.createdBy : state.me.name,
        createdAt: s ? s.createdAt : new Date().toISOString()
      };
      /* 목표가 바뀌었으면 이전 값을 자동으로 남긴다 (D-031). 담당자가 적을 것은 없다. */
      if (s) {
        const changes = diffTargets(s, body);
        const hist = Array.isArray(s.targetHistory) ? s.targetHistory.slice() : [];
        if (changes.length) hist.push({ at: body.updatedAt, by: state.me.name || "익명", changes });
        body.targetHistory = hist.slice(-20);
        body.lifecycle = s.lifecycle || "active";
        /* 목표 완료월을 뒤로 미뤘으면 그것이 곧 '이월'이다 — 별도 화면 없이 여기서 기록한다 */
        const oldSp = spanOf(s), carries = Array.isArray(s.carries) ? s.carries.slice() : [];
        if (B.y * 12 + B.m > oldSp.ey * 12 + oldSp.em) {
          carries.push({
            from: oldSp.ey + "-" + pad2(oldSp.em), to: B.y + "-" + pad2(B.m),
            at: body.updatedAt, by: state.me.name || "익명", note: "과제 수정에서 기간 연장"
          });
        }
        body.carries = carries;
        body.closedAt = s.closedAt || null;
        body.closedBy = s.closedBy || null;
        body.closeNote = s.closeNote || null;
      } else {
        body.targetHistory = [];
        body.lifecycle = "active";
        body.carries = [];
      }
      try {
        if (s) await save("strategies/" + s.id, body);
        else { const ref = await state.db.collection("strategies").add(body); state.selected = ref.id; state.view = "detail"; }
        dlg.close(); toast(s ? "과제를 수정했습니다." : "전략을 등록했습니다. 계획 항목을 클릭해 진행 상태를 표시해 주세요."); render();
      } catch (e2) { err.hidden = false; err.textContent = writeError(e2); }
    });

  /* 연차별 목표 칸 — 추진기간을 바꾸면 다시 그리고, 입력한 값은 유지한다 */
  const ytBox = $("#ytBox");
  function fillYT() {
    const A = parseYM($("#fStart").value), B = parseYM($("#fEnd").value);
    if (!A || !B || B.y * 12 + B.m < A.y * 12 + A.m || B.y - A.y > 29) {
      ytBox.innerHTML = '<span class="help">추진 시작과 목표 완료를 먼저 정확히 입력해 주세요.</span>';
      return;
    }
    const sy = A.y, ey = B.y;
    /* 기본값은 개월수 안분 — spanOf/yearTargetsOf 와 같은 규칙을 쓴다 */
    const lin = {};
    yearTargetsOf({ startYear: A.y, startMonth: A.m, endYear: B.y, endMonth: B.m })
      .forEach(t => lin[t.year] = t.linear);
    /* 사용자가 직접 고친 칸만 물려받는다. 자동 생성된 기본값은 기간이 바뀌면 다시 계산해야
       한다 — 안 그러면 예전 마지막 연도의 고정 100%가 남아 단조 증가가 깨진다. */
    const keep = {};
    ytBox.querySelectorAll("[data-yt]").forEach(el => { if (el.dataset.edited === "1") keep[el.dataset.yt] = el.value; });
    const src = s && s.yearTargets && typeof s.yearTargets === "object" ? s.yearTargets : null;
    const n = ey - sy + 1;
    ytBox.innerHTML = Array.from({ length: n }, (_, i) => {
      const yy = sy + i, last = i === n - 1;
      let v = keep[yy];
      if (v == null || v === "") v = (src && src[yy] != null) ? src[yy] : (lin[yy] != null ? lin[yy] : Math.round((i + 1) / n * 100));
      return `<label class="ytcell"><span class="yy">${yy}</span>
        <input type="number" data-yt="${yy}"${keep[yy] != null ? ' data-edited="1"' : ""} min="0" max="100" value="${last ? 100 : clamp(Math.round(+v || 0), 0, 100)}" ${last ? "readonly title='마지막 연도는 100%로 고정입니다'" : ""}></label>`;
    }).join("");
    /* 직접 고친 칸에 표시를 남겨, 추진기간을 다시 바꿔도 살아남게 한다 */
    ytBox.querySelectorAll("[data-yt]:not([readonly])").forEach(el =>
      el.addEventListener("input", () => { el.dataset.edited = "1"; checkYT(); }));
    checkYT();
  }
  /** 누적 목표가 뒤 연도에서 줄어들면 그 칸을 바로 표시한다 */
  function checkYT() {
    const warn = $("#ytWarn"); if (!warn) return;
    const els = [...ytBox.querySelectorAll("[data-yt]")];
    let last = -1; const bad = [];
    els.forEach(el => {
      const v = clamp(Math.round(+el.value || 0), 0, 100);
      el.classList.toggle("bad", v < last);
      if (v < last) bad.push(el.dataset.yt);
      last = Math.max(last, v);
    });
    warn.hidden = !bad.length;
    if (bad.length) warn.textContent = "누적 목표는 뒤 연도로 갈수록 줄어들 수 없습니다 — " + bad.join(", ") + "년 값을 확인해 주세요.";
  }
  $("#fStart").addEventListener("change", fillYT);
  $("#fEnd").addEventListener("change", fillYT);
  fillYT();

  /* 계획 줄 수를 세어 즉시 알려준다 — 2줄 이하면 달성률이 계단식이 된다 */
  const pl = $("#fPlans"), plc = $("#fPlansCount");
  const countPlans = () => {
    const n = pl.value.split("\n").map(x => x.replace(/^[-·•*\s]+/, "").trim()).filter(Boolean).length;
    if (!n) { plc.innerHTML = '<b style="color:var(--risk)">한 줄 이상 입력해 주세요.</b>'; return; }
    const step = Math.round(100 / n);
    plc.innerHTML = n <= 2
      ? `<b style="color:var(--risk)">현재 ${n}줄 — 달성률이 ${n === 1 ? "0 · 100%" : "0 · 50 · 100%"} 로만 움직입니다.</b> 4~8줄로 쪼개 주세요.`
      : `현재 <b>${n}줄</b> — 한 항목을 완료하면 달성률이 약 <b>${step}%p</b> 올라갑니다.${n > 12 ? " 너무 잘게 쪼개면 매 분기 체크가 번거로워집니다." : ""}`;
  };
  pl.addEventListener("input", countPlans); countPlans();

  const siteSel = $("#fSite"), teamSel = $("#fTeam");
  const fillTeams = () => {
    const list = siteSel.value ? teamsOfSite(siteSel.value) : [];
    teamSel.innerHTML = list.length
      ? list.map(t => `<option value="${esc(t.id)}" ${s && s.teamId === t.id ? "selected" : (!s && myTeam && myTeam.id === t.id ? "selected" : "")}>${esc(t.name)}</option>`).join("")
      : '<option value="">이 사업장에 등록된 팀이 없습니다</option>';
    teamSel.disabled = !list.length;
  };
  siteSel.onchange = fillTeams; fillTeams();
}

function openProgressForm(id) {
  if (!state.canEdit) { toast("보기 전용 권한으로는 실적을 입력할 수 없습니다."); return; }
  if (!state.me.name) { openMeForm(() => openProgressForm(id)); return; }
  const s = state.strategies.find(x => x.id === id); if (!s) return;
  const cq = curQuarter(), cm = curMonth(), plans = plansOf(s);
  let draft = plans.map(p => p.status);
  const calcPct = () => plans.length ? Math.round(draft.reduce((a, st) => a + ST_WEIGHT[st], 0) / plans.length * 100) : 0;

  const form = openDialog(`
    <div class="dlg-h"><div><h2>실적 입력</h2><p>${esc(siteOf(s))} › ${esc(teamOf(s))} · ${esc(s.title)}</p></div>
    <button class="x" data-close type="button" aria-label="닫기">×</button></div>
    <div class="dlg-b">
      <div class="row2">
        <div class="field"><label for="pKind">보고 단위<span class="req">*</span></label>
          <select id="pKind"><option value="q">분기 (필수 보고)</option><option value="m">월 (중간 기록, 선택)</option></select>
          <span class="help">미제출 독촉과 집계는 분기 보고를 기준으로 합니다.</span></div>
        <div class="field"><label for="pPeriod">보고 시점<span class="req">*</span></label>
          <select id="pPeriod" required></select>
          <span class="help" id="pDup" hidden></span></div>
      </div>
      <fieldset class="fieldset"><legend>계획 항목 진행 상태 — 달성률이 여기서 나옵니다</legend>
        ${plans.length ? `<ul class="plans" id="pPlans">${plans.map((x, i) => `
          <li data-st="${x.status}"><button type="button" class="pchip" data-st="${x.status}" data-i="${i}">${ST[x.status]}</button>
          <span class="ptext">${esc(x.text)}</span></li>`).join("")}</ul>`
      : '<p class="help">등록된 계획 항목이 없습니다. 과제 수정에서 세부 계획을 먼저 넣어 주세요.</p>'}

          <div class="d" style="margin-left:auto">기간경과 기대치 <b class="num">${expectedPct(s)}%</b></div>
        </div>
      </fieldset>
      <div class="field"><label for="pAch">해당 기간 실적<span class="req">*</span></label>
        <textarea id="pAch" required placeholder="예: UL 측 EPD Report 최종 보고서 제출 및 심사 대응 (26.04~08)&#10;UL EPD 인증 획득 (26.08.04)"></textarea></div>
      ${s.kpiTarget != null && s.kpiTarget !== "" ? `
      <div class="field"><label for="pKpi">KPI 실적 — ${esc(s.kpiName || "지표")}${s.kpiUnit ? " (" + esc(s.kpiUnit) + ")" : ""}</label>
        <input type="number" step="any" id="pKpi" placeholder="목표 ${esc(s.kpiTarget)}"></div>` : ""}
      <div class="field"><label for="pDelay">계획대비 지연 사유 <span class="help">— 기대치 미달 시 필수</span></label>
        <textarea id="pDelay" placeholder="계획 대비 지연된 항목과 원인, 개선 필요사항을 적어 주세요."></textarea></div>
      <div class="field"><label for="pPlan">Catch-up / Follow-up Plan</label>

      <div class="err" id="pErr" hidden></div>
    </div>
    <div class="dlg-f"><button class="btn" data-close type="button">취소</button>
    <button class="btn btn-primary" type="submit" id="pSubmit">실적 제출</button></div>`,
    async form2 => {
      const err = $("#pErr"), period = form2.pPeriod.value, pct = calcPct();
      if (pct < expectedPct(s) - 5 && !form2.pDelay.value.trim() && pct < 100) {
        err.hidden = false; err.textContent = "기대치보다 진척이 낮습니다. 지연 사유를 입력해 주세요."; $("#pDelay").focus(); return;
      }
      const body = {
        strategyId: id, period, progress: pct,
        achievement: form2.pAch.value.trim(),
        kpiActual: form2.pKpi && form2.pKpi.value !== "" ? +form2.pKpi.value : null,
        delayReason: form2.pDelay.value.trim(), catchupPlan: form2.pPlan.value.trim(),
        author: state.me.name, team: state.me.team || teamOf(s), site: siteOf(s),
        /* 제출 시점의 분모를 함께 굳힌다 — 나중에 계획 항목을 늘리면 과거 %의 근거가 사라진다 */

        planDone: draft.filter(x => x === "done").length,
        planDoing: draft.filter(x => x === "doing").length,
        updatedAt: new Date().toISOString()
      };

        if (plans.length) await save("strategies/" + id, {
          plans: plans.map((p, i) => p.status === draft[i] ? p
            : ({ ...p, status: draft[i], updatedBy: state.me.name || "익명", updatedAt: body.updatedAt })),
          updatedAt: body.updatedAt
        }, "update");
        await save("progress/" + id + "__" + period, body);
        dlg.close(); toast(period.replace("-", " ") + " 실적을 저장했습니다. 달성률 " + pct + "%");
      } catch (e2) { err.hidden = false; err.textContent = writeError(e2); }
    });

  const kind = $("#pKind"), sel = $("#pPeriod"), pd = $("#pDup"), submit = $("#pSubmit");
  const checkDup = () => {
    const hit = state.progress.find(p => p.strategyId === id && p.period === sel.value);
    pd.hidden = !hit;
    submit.textContent = hit ? "실적 수정" : "실적 제출";
    if (hit) pd.textContent = "이미 제출된 기간입니다. 저장하면 기존 내용을 덮어씁니다.";
    form.pAch.value = hit ? (hit.achievement || "") : "";
    form.pDelay.value = hit ? (hit.delayReason || "") : "";
    form.pPlan.value = hit ? (hit.catchupPlan || "") : "";
    if (form.pKpi) form.pKpi.value = hit && hit.kpiActual != null ? hit.kpiActual : "";
  };
  const fillPeriods = () => {
    const q = kind.value === "q", opts = q ? quarterOptions() : monthOptions(), cur = q ? cq : cm;
    sel.innerHTML = opts.map(p => `<option value="${p}" ${p === cur ? "selected" : ""}>${p.replace("-", " ")}${p === cur ? " (현재)" : ""}</option>`).join("");
    checkDup();
  };
  kind.onchange = fillPeriods; sel.onchange = checkDup; fillPeriods();
  form.querySelectorAll("#pPlans .pchip").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    draft[i] = ST_ORDER[(ST_ORDER.indexOf(draft[i]) + 1) % 3];
    b.dataset.st = draft[i]; b.textContent = ST[draft[i]]; b.closest("li").dataset.st = draft[i];
    $("#pCalc").textContent = calcPct() + "%";
    $("#pCalcD").textContent = `완료 ${draft.filter(x => x === "done").length} · 진행중 ${draft.filter(x => x === "doing").length} · 전체 ${plans.length}`;
  });
}

          <div>${d.isDefault ? "" : `<button type="button" class="btn btn-sm" data-dlreset="${p}">기본값으로</button>`}</div>
        </div>`;
      }).join("")}</div>
      <div class="help">● 표시가 현재 분기입니다. 마감일이 지나면 대시보드의 미제출 표시가 빨갛게 바뀝니다.</div>

    </div>
    <div class="dlg-f"><button class="btn" data-close type="button">닫기</button>
      <button class="btn btn-primary" type="button" id="dlSave">저장</button></div>`, () => { });

  const err = $("#dlErr");

function printSummary() {
  const all = state.strategies;
  if (!all.length) { toast("등록된 과제가 없어 인쇄할 내용이 없습니다."); return; }
  const cq = curQuarter(), dl = deadlineChip(cq);
  const stc = countStatus(all), attn = stc.warn + stc.risk;
  const submitted = all.filter(x => submittedThisQuarter(x.id)).length;
  const sr = siteRollup(), at = attnList();
  const esgRows = ["E", "S", "G"].map(k => {
    const l = all.filter(x => x.esg === k);
    return [ESG_SHORT[k], [l.length], [avg(l.map(pctOf)) + "%"], [avg(l.map(expectedPct)) + "%"],
      [l.filter(x => ["warn", "risk"].includes(statusOf(x).key)).length]];
  });
  $("#printRoot").innerHTML = `<div class="pr-page">
    <div class="pr-h">
      <div><h1>ESG 중장기전략 이행 현황</h1>
        <div class="pr-sub">${cq.replace("-", " ")} 기준 · 제출 마감 ${dl.isDefault ? "미지정" : dl.date} · 출력 ${new Date().toLocaleDateString("ko-KR")}</div></div>
      <div class="pr-big">${avg(all.map(pctOf))}%<span>전사 평균 달성률 (기대 ${avg(all.map(expectedPct))}%)</span></div>
    </div>

    <div class="pr-sec">종합</div>
    ${prTable(["등록 과제", "정상", "지연", "위험", "완료", "미착수", cq.replace("-", " ") + " 제출"],
      [[[all.length + "건"], [stc.ok], [stc.warn], [stc.risk], [stc.done], [stc.none], [submitted + " / " + all.length]]])}

    <div class="pr-sec">계열사별</div>
    ${prTable(["계열사", "진행 과제(종료)", "평균 달성률", "기대치", "차이", "조치 필요", "당분기 제출"],
      coRollup().map(r => [r.name, [r.nOpen + (r.nClosed ? " (+" + r.nClosed + ")" : "")],
        [pctText(r)], [hasOpen(r) ? r.exp + "%" : "—"],
        [hasOpen(r) ? ((r.pct - r.exp >= 0 ? "+" : "") + (r.pct - r.exp) + "%p") : "—"],
        [r.stc.warn + r.stc.risk], [r.sub + " / " + r.nOpen]]))}

    <div class="pr-sec">사업장별</div>
    ${prTable(["사업장", "진행 과제(종료)", "평균 달성률", "기대치", "차이", "조치 필요", "당분기 제출"],
      sr.map(r => [r.name, [r.nOpen + (r.nClosed ? " (+" + r.nClosed + ")" : "")],
        [pctText(r)], [hasOpen(r) ? r.exp + "%" : "—"],
        [hasOpen(r) ? ((r.pct - r.exp >= 0 ? "+" : "") + (r.pct - r.exp) + "%p") : "—"],
        [r.stc.warn + r.stc.risk], [r.sub + " / " + r.nOpen]]))}

    <div class="pr-sec">대분류별</div>
    ${prTable(["대분류", "과제", "평균 달성률", "기대치", "조치 필요"],
      catRollup().map(x => {
        const l = all.filter(s => (catOf(s) || "") === x.code);
        return [x.name, [l.length], [avg(l.map(pctOf)) + "%"], [avg(l.map(expectedPct)) + "%"],
          [l.filter(s => ["warn", "risk"].includes(statusOf(s).key)).length]];
      }))}

    <div class="pr-sec">ESG 영역별</div>
    ${prTable(["영역", "과제", "평균 달성률", "기대치", "조치 필요"], esgRows)}

    <div class="pr-sec">조치 필요 과제 (${at.length}건)</div>
    ${at.length ? prTable(["사업장 · 팀", "실행과제", "상태", "달성", "기대", "당분기", "지연 사유"],
      at.slice(0, 18).map(x => {
        const lq = lastQuarterlyOf(x.id);
        return [esc(siteOf(x)) + " · " + esc(teamOf(x)), esc(x.title), statusOf(x).label,
          [pctOf(x) + "%"], [expectedPct(x) + "%"],
          submittedThisQuarter(x.id) ? "제출" : "미제출",
          esc((lq && lq.delayReason ? lq.delayReason : "—").slice(0, 60))];
      })) : '<div class="pr-note">조치가 필요한 과제가 없습니다.</div>'}
    ${at.length > 18 ? `<div class="pr-note">그 외 ${at.length - 18}건은 시스템에서 확인해 주세요.</div>` : ""}
    <div class="pr-note">달성률 = (완료 항목 + 진행중 항목 × 0.5) ÷ 전체 계획 항목. 기대치 = 과제별 연차별 누적 목표를 분기로 나눈 값.</div>
  </div>`;
  window.print();
}
/** 과제별 원문 5블록 양식 */
function printForms() {
  const f = state.filters;
  const list = state.strategies.filter(x => siteMatch(x, f.site)).sort((a, b) =>
    siteOf(a).localeCompare(siteOf(b), "ko") || teamOf(a).localeCompare(teamOf(b), "ko"));
  if (!list.length) { toast("인쇄할 과제가 없습니다."); return; }
  const cq = curQuarter();
  $("#printRoot").innerHTML = list.map(x => {
    const logs = progressFor(x.id), lq = logs[0], c = planCounts(x), st = statusOf(x);
    const plans = plansOf(x);
    const delays = logs.filter(l => l.delayReason);
    const plansTxt = logs.filter(l => l.catchupPlan);
    return `<div class="pr-page">
      <div class="pr-h">
        <div><h1>${esc(x.title)}</h1>
          <div class="pr-sub">${esc(coOf(x))} › ${esc(siteOf(x))} · ${esc(teamOf(x))} · ${esc(x.owner || "담당자 미지정")} · 추진기간 ${spanLabel(x)}${catOf(x) ? " · " + esc(CAT_NAME[catOf(x)]) : ""}</div></div>
        <div class="pr-big">${pctOf(x)}%<span>${st.label} · 기대 ${expectedPct(x)}%</span></div>
      </div>
      <table class="pr-f">
        <tr><th>실행과제(명)</th><td>${esc(x.title)}
          ${x.kpiName ? `<div class="pr-meta"><span>KPI · ${esc(x.kpiName)}${x.kpiUnit ? " (" + esc(x.kpiUnit) + ")" : ""}</span>
            ${x.kpiBase != null && x.kpiBase !== "" ? `<span>기준 ${esc(x.kpiBase)}</span>` : ""}
            ${x.kpiTarget != null && x.kpiTarget !== "" ? `<span>목표 ${esc(x.kpiTarget)}</span>` : ""}
            ${lq && lq.kpiActual != null && lq.kpiActual !== "" ? `<span>실적 ${esc(lq.kpiActual)}</span>` : ""}</div>` : ""}
          ${x.purpose ? `<div class="pr-meta"><span>${esc(x.purpose)}</span></div>` : ""}</td></tr>
        <tr><th>계획(목표)</th><td>${plans.length ? `<ul>${plans.map(pp =>
          `<li>[${ST[pp.status]}] ${esc(pp.text)}</li>`).join("")}</ul>
          <div class="pr-meta"><span>완료 ${c.done} · 진행중 ${c.doing} · 미착수 ${c.todo} (전체 ${c.total})</span></div>` : "—"}</td></tr>
        <tr><th>${lq ? pLabel(lq.period) : cq.replace("-", " ")} 실적</th><td>${logs.length
          ? logs.slice(0, 4).map(l => `${pLabel(l.period)} (${l.progress}%) · ${esc(l.author || "익명")}\n${esc(l.achievement || "—")}`).join("\n\n")
          : "제출된 실적이 없습니다."}</td></tr>
        <tr><th>계획대비 지연 사유<br>(개선 필요사항 포함)</th><td>${delays.length
          ? delays.slice(0, 3).map(l => `${pLabel(l.period)} · ${esc(l.delayReason)}`).join("\n\n") : "—"}</td></tr>
        <tr><th>Catch-up /<br>Follow-up Plan</th><td>${plansTxt.length
          ? plansTxt.slice(0, 3).map(l => `${pLabel(l.period)} · ${esc(l.catchupPlan)}`).join("\n\n") : "—"}</td></tr>
      </table>
      <div class="pr-note">출력 ${new Date().toLocaleDateString("ko-KR")} · ${cq.replace("-", " ")} 기준</div>
    </div>`;
  }).join("");
  window.print();
}

/* ============================ CSV ============================ */
async function exportCsv() {
  const cols = ["계열사", "사업장", "팀", "적용범위", "진행상태", "ESG영역", "대분류", "실행과제명", "담당자", "시작(연.월)", "완료(연.월)", "추진개월", "우선순위",
    "달성률(%)", "기대치(%)", "상태", "계획항목수", "완료", "진행중", "미착수",
    "KPI", "단위", "기준값", "기준연도", "목표값",
    "보고시점", "보고단위", "제출시점달성률(%)", "KPI실적", "실적내용", "지연사유", "CatchUpPlan", "작성자", "갱신일시"];
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [cols.map(q).join(",")];
  state.strategies.forEach(s => {
    const c = planCounts(s), logs = progressFor(s.id);
    const sp = spanOf(s);
    const base = [coOf(s), siteOf(s), teamOf(s), s.scope === "company" ? "전사 공통" : "사업장",
      (LC[s.lifecycle] || "진행") + (carryCount(s) ? " (이월 " + carryCount(s) + ")" : ""),
      ESG_SHORT[s.esg], catLabel(s), s.title, s.owner,
      sp.sy + "." + pad2(sp.sm), sp.ey + "." + pad2(sp.em), spanMonths(s), s.priority,
      pctOf(s), expectedPct(s), statusOf(s).label, c.total, c.done, c.doing, c.todo,
      s.kpiName, s.kpiUnit, s.kpiBase, s.kpiBaseYear, s.kpiTarget];
    if (!logs.length) lines.push([...base, "", "", "", "", "", "", "", "", ""].map(q).join(","));
    else logs.forEach(l => lines.push([...base,
      l.period, isQuarter(l.period) ? "분기" : "월", l.progress, l.kpiActual ?? "",
      l.achievement || "", l.delayReason || "", l.catchupPlan || "", l.author || "", l.updatedAt || ""].map(q).join(",")));
  });
  const data = "﻿" + lines.join("\r\n");
  const filename = "ESG_중장기전략_" + curQuarter() + ".csv";
  let dl = null;
  try { dl = await claude.use("downloads"); } catch (e) { dl = null; }
  if (dl) { try { await dl.save({ filename, data }); toast("CSV를 저장했습니다."); return; } catch (e) { } }
  try { await navigator.clipboard.writeText(data); toast("파일 저장을 사용할 수 없어 CSV 내용을 클립보드에 복사했습니다."); }
  catch (e) { toast("CSV를 내보내지 못했습니다."); }
}
</script>
