<meta charset="utf-8">
<title>ESG 중장기전략 진척관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#A9AEB5; --frame:rgba(255,255,255,.52); --frame-line:rgba(255,255,255,.75);
  --panel:#FFFFFF; --panel-2:#F5F6F8; --cell:#FCFCFD; --cell-line:#EDEFF2;
  --ink:#14181C; --ink-2:#454C54; --muted:#767E88; --line:#E6E8EC; --line-2:#F0F1F4;
  --chip:rgba(255,255,255,.94); --chip-line:rgba(255,255,255,.5);
  --today:#2E7BF6; --today-soft:#E8F0FE;
  --e:#12A67A; --s:#EE8B3C; --g:#7B5BE6;
  --ok:#0E9F6E; --ok-soft:#E4F5EE;
  --warn:#C97A16; --warn-soft:#FCF1DE;
  --risk:#DB4A38; --risk-soft:#FCE9E5;
  --done:#2E7BF6; --done-soft:#E8F0FE;
  --accent:#14181C;
  --r-xl:30px; --r-lg:20px; --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(20,26,34,.04), 0 10px 28px -18px rgba(20,26,34,.20);
  --sh-pop:0 2px 4px rgba(20,26,34,.06), 0 20px 44px -22px rgba(20,26,34,.34);
  --sh-blk:0 1px 2px rgba(20,26,34,.10), 0 8px 18px -10px rgba(20,26,34,.30);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B0D0F; --frame:rgba(255,255,255,.045); --frame-line:rgba(255,255,255,.08);
    --panel:#171B1F; --panel-2:#1E2328; --cell:#1B2024; --cell-line:#24292E;
    --ink:#E9ECEF; --ink-2:#B7BEC5; --muted:#89919A; --line:#2A3035; --line-2:#22272B;
    --chip:rgba(255,255,255,.13); --chip-line:rgba(255,255,255,.10);
    --today:#5B9BFF; --today-soft:#16233A;
    --e:#1FBD8C; --s:#F09B4F; --g:#9075F0;
    --ok:#2BBE85; --ok-soft:#12281F;
    --warn:#DDA33C; --warn-soft:#2A2214;
    --risk:#F06853; --risk-soft:#2E1A16;
    --done:#5B9BFF; --done-soft:#16233A;
    --accent:#E9ECEF;
    --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -20px rgba(0,0,0,.9);
    --sh-pop:0 3px 8px rgba(0,0,0,.55), 0 24px 50px -24px rgba(0,0,0,1);
    --sh-blk:0 1px 3px rgba(0,0,0,.5), 0 10px 22px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0B0D0F; --frame:rgba(255,255,255,.045); --frame-line:rgba(255,255,255,.08);
  --panel:#171B1F; --panel-2:#1E2328; --cell:#1B2024; --cell-line:#24292E;
  --ink:#E9ECEF; --ink-2:#B7BEC5; --muted:#89919A; --line:#2A3035; --line-2:#22272B;
  --chip:rgba(255,255,255,.13); --chip-line:rgba(255,255,255,.10);
  --today:#5B9BFF; --today-soft:#16233A;
  --e:#1FBD8C; --s:#F09B4F; --g:#9075F0;
  --ok:#2BBE85; --ok-soft:#12281F;
  --warn:#DDA33C; --warn-soft:#2A2214;
  --risk:#F06853; --risk-soft:#2E1A16;
  --done:#5B9BFF; --done-soft:#16233A;
  --accent:#E9ECEF;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -20px rgba(0,0,0,.9);
  --sh-pop:0 3px 8px rgba(0,0,0,.55), 0 24px 50px -24px rgba(0,0,0,1);
  --sh-blk:0 1px 3px rgba(0,0,0,.5), 0 10px 22px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding:20px;
}
h1,h2,h3,h4{font-family:"Gothic A1","IBM Plex Sans KR",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--today);outline-offset:2px;border-radius:8px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ================= frame ================= */
.app{
  max-width:1520px;margin:0 auto;background:var(--frame);
  border:1px solid var(--frame-line);border-radius:var(--r-xl);
  padding:14px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;
  backdrop-filter:blur(24px) saturate(1.2);
  box-shadow:0 1px 1px rgba(255,255,255,.4) inset, 0 30px 70px -40px rgba(16,22,30,.6);
}
.rail{
  background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0;
}
.logo{width:38px;height:38px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;margin-bottom:14px;flex:none}
.logo svg{width:19px;height:19px}
.rail-nav{display:flex;flex-direction:column;gap:6px;flex:1}
.ricon{
  width:42px;height:42px;border-radius:14px;border:1px solid transparent;background:none;cursor:pointer;
  display:grid;place-items:center;color:var(--muted);
}
.ricon:hover{background:var(--panel-2);color:var(--ink)}
.ricon[aria-current="page"]{background:var(--ink);color:var(--panel);box-shadow:var(--sh-blk)}
.ricon svg{width:19px;height:19px}
.ricon[hidden]{display:none}

.stage{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ================= topbar ================= */
.topbar{
  background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh);
  padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tabs{display:flex;gap:6px}
.tab{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  border-radius:99px;padding:8px 15px;cursor:pointer;font-weight:500;font-size:13px;color:var(--ink-2);white-space:nowrap;
}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--today-soft);border-color:transparent;color:var(--today);font-weight:600}
.tab svg{width:15px;height:15px;flex:none}
.tab[hidden]{display:none}
.iconbtn{
  width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none;
}
.iconbtn:hover{background:var(--panel-2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.spacer{flex:1;min-width:8px}
.stack{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;gap:0}
.av{
  width:30px;height:30px;border-radius:99px;display:grid;place-items:center;flex:none;
  font-family:"Gothic A1",sans-serif;font-weight:700;font-size:10.5px;color:#fff;
  border:2px solid var(--panel);margin-right:-9px;
}
.stack .more{margin-left:16px;font-size:12px;font-weight:600;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.pillbtn{
  display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:9px 16px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:13px;white-space:nowrap;
}
.pillbtn:hover{background:var(--panel-2)}
.pillbtn.dark{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:600;box-shadow:var(--sh-blk)}
.pillbtn.dark:hover{filter:brightness(1.15);background:var(--ink)}
.pillbtn svg{width:15px;height:15px}
.pillbtn[hidden]{display:none}
.pillbtn:disabled{opacity:.45;cursor:not-allowed}

/* ================= panels ================= */
.panel{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--sh);padding:20px 22px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{font-size:23px;font-weight:800}
.ph h3{font-size:17px;font-weight:800}
.ph .sub{font-size:12.5px;color:var(--muted)}
.ph .r{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ghost{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  border-radius:99px;padding:6px 13px;font-size:12px;cursor:pointer;color:var(--ink-2);white-space:nowrap;
}
.ghost:hover{background:var(--panel-2);color:var(--ink)}
.ghost svg{width:13px;height:13px}
.ghost[hidden]{display:none}
select.ghost{padding-right:26px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 54%,calc(100% - 9px) 54%;background-size:5px 5px;background-repeat:no-repeat}

/* ================= timeline ================= */
/* 좌우 패딩을 두면 스티키 과제명 칼럼이 그 띠를 못 덮어 블록이 삐져나온다 */
.tl-wrap{overflow-x:auto;overflow-y:hidden;padding-bottom:4px;scrollbar-width:thin}
.tl{min-width:min-content}
.tl-row{display:flex;align-items:stretch}
.tl-name{
  width:236px;flex:none;position:sticky;left:0;z-index:3;background:var(--panel);
  padding-right:12px;display:flex;align-items:center;
}
.tl-head .tl-name{align-items:flex-end;padding-bottom:9px}
.tl-name .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-weight:600}
.card-name{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);
  padding:8px 11px;background:var(--panel);width:100%;min-width:0;text-align:left;cursor:pointer;
}
.card-name:hover{background:var(--panel-2);border-color:var(--muted)}
.card-name .ic{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center}
.card-name .ic svg{width:15px;height:15px;color:#fff}
.card-name .tx{min-width:0}
.card-name .t1{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-name .t2{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tl-track{position:relative;flex:none;display:flex;gap:0}
.tl-head .tl-track{align-items:flex-end}
.qh{flex:none;text-align:center;padding:5px 0 9px;border-radius:12px 12px 0 0}
.qh .q{display:block;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink-2)}
.qh .y{display:block;font-size:9.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;letter-spacing:.04em}
.qh.past .q,.qh.past .y{color:var(--muted);opacity:.75}
.qh.now{background:var(--today);box-shadow:var(--sh-blk)}
.qh.now .q,.qh.now .y{color:#fff}

.tl-body{position:relative}
.tl-body .tl-row{padding:5px 0}
.cellrow{position:absolute;inset:0;display:flex;pointer-events:none}
.cl{flex:none;border-radius:12px;background:var(--cell);box-shadow:0 0 0 1px var(--cell-line) inset;margin:5px 3px}
.cl.past{background:transparent;box-shadow:0 0 0 1px var(--cell-line) inset;
  background-image:repeating-linear-gradient(45deg,transparent 0 4px,var(--cell-line) 4px 5.5px)}
.nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--today);z-index:4;pointer-events:none;opacity:.85}

.blk{
  position:absolute;top:5px;bottom:5px;border-radius:14px;box-shadow:var(--sh-blk);
  display:flex;align-items:center;justify-content:center;padding:0 12px;overflow:hidden;cursor:pointer;
  border:0;text-align:left;color:#fff;z-index:2;
}
/* 긴 블록은 오른쪽 칩 자리를 비워 라벨과 겹치지 않게 한다 */
.blk.has-chip{padding-right:122px}
.blk:hover{filter:brightness(1.06)}
.blk.esg-E{background:linear-gradient(135deg,var(--e),color-mix(in srgb,var(--e) 78%,#0B6B52))}
.blk.esg-S{background:linear-gradient(135deg,var(--s),color-mix(in srgb,var(--s) 78%,#B75C13))}
.blk.esg-G{background:linear-gradient(135deg,var(--g),color-mix(in srgb,var(--g) 78%,#4B32AE))}
/* 라벨 묶음은 블록 가운데. 여러 해에 걸친 넓은 블록도 가운데는 화면에 남는다 */
.blk .bmid{display:flex;align-items:center;gap:9px;min-width:0;margin-bottom:3px}
.blk .bic{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.24);display:grid;place-items:center;flex:none}
.blk .bic svg{width:14px;height:14px}
.blk .bt{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;min-width:0}
/* 달성률: 블록 아래쪽을 가로지르는 띠 */
.blk .bar{position:absolute;left:11px;right:11px;bottom:6px;height:3px;border-radius:99px;background:rgba(255,255,255,.32);overflow:hidden}
.blk .bar i{display:block;height:100%;border-radius:99px;background:#fff}
.blk .bchip{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:var(--chip);border-radius:99px;padding:2px 9px;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;gap:4px;backdrop-filter:blur(6px);white-space:nowrap;
}
.blk .bchip .d{width:5px;height:5px;border-radius:99px;flex:none}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.tl-legend .li{display:flex;align-items:center;gap:6px}
.tl-legend .sw{width:11px;height:11px;border-radius:4px;flex:none}
.tl-legend .hatch{background-image:repeating-linear-gradient(45deg,transparent 0 3px,var(--muted) 3px 4px);box-shadow:0 0 0 1px var(--line) inset}

/* ================= bottom grid ================= */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(298px,1fr));gap:14px;align-items:start}

/* action cards */
.acards{display:flex;flex-direction:column;gap:9px}
.acard{
  border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--panel);
  text-align:left;cursor:pointer;width:100%;
}
.acard:hover{background:var(--panel-2)}
.acard.hot{background:var(--warn-soft);border-color:transparent}
.acard.hot .at{color:var(--ink)}
.acard .ah{display:flex;align-items:flex-start;gap:9px}
.acard .at{font-weight:700;font-size:13.5px;line-height:1.4;min-width:0}
.acard .ab{
  margin-left:auto;flex:none;background:var(--chip);border:1px solid var(--chip-line);border-radius:99px;
  padding:2px 9px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.acard.hot .ab{background:rgba(255,255,255,.72);border-color:transparent}
.acard .ad{font-size:12px;color:var(--muted);margin-top:3px}
.acard .achips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mini{
  display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border-radius:99px;
  padding:4px 10px;font-size:11px;font-weight:500;color:var(--ink-2);white-space:nowrap;
}
.acard.hot .mini{background:rgba(255,255,255,.66);color:var(--ink-2)}
.mini svg{width:12px;height:12px;opacity:.7}
.mini b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}

/* team cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:9px}
.tcard{border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:center;background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:2px}
.tcard .tav{width:44px;height:44px;border-radius:99px;display:grid;place-items:center;color:#fff;font-family:"Gothic A1",sans-serif;font-weight:800;font-size:14px;margin-bottom:6px}
.tcard .tn{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tcard .tm{font-size:10.5px;color:var(--muted)}
.tcard .tp{display:flex;align-items:center;gap:5px;background:var(--panel-2);border-radius:99px;padding:3px 10px;margin-top:8px;font-size:11px;font-weight:600}
.tcard .tp .num{font-size:12px}
.tcard .ttrack{width:100%;height:5px;border-radius:99px;background:var(--line-2);margin-top:8px;position:relative;overflow:hidden}
.tcard .ttrack i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.tcard .ttrack b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.3}

/* summary orb */
.orb-panel{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 22px}
.orb{
  width:150px;height:150px;border-radius:99px;position:relative;margin:4px 0 18px;flex:none;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 16%, transparent 42%),
    radial-gradient(circle at 68% 78%, color-mix(in srgb,var(--today) 55%,#fff) 0%, transparent 55%),
    linear-gradient(150deg, color-mix(in srgb,var(--today) 32%,#fff), color-mix(in srgb,var(--today) 88%,#12305F));
  box-shadow:0 18px 34px -16px color-mix(in srgb,var(--today) 60%,transparent),
             0 2px 5px rgba(20,26,34,.14),
             inset 0 -10px 22px -8px rgba(10,26,60,.45);
}
.orb .on{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  text-shadow:0 1px 8px rgba(12,30,62,.5);
}
.orb .on .v{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:40px;line-height:1}
.orb .on .k{font-size:10.5px;letter-spacing:.1em;font-family:"IBM Plex Mono",monospace;opacity:.92;margin-top:2px}
.orb-panel h3{font-size:19px;font-weight:800;margin-bottom:5px}
.orb-panel .od{font-size:12.5px;color:var(--muted);max-width:34ch;margin-bottom:16px}
.orb-panel .od b{color:var(--ink)}
.ostats{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.ostat{background:var(--panel-2);border-radius:14px;padding:9px 13px;min-width:78px}
.ostat .k{font-size:10px;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.ostat .v{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:19px;line-height:1.2;margin-top:1px}
.ostat .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:1px}
.ostat.risk .v{color:var(--risk)}
.oacts{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.75}
.pill.s-ok{background:var(--ok-soft);color:var(--ok)}
.pill.s-warn{background:var(--warn-soft);color:var(--warn)}
.pill.s-risk{background:var(--risk-soft);color:var(--risk)}
.pill.s-done{background:var(--done-soft);color:var(--done)}
.pill.s-none{background:var(--line-2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 11px 2px 9px;font-size:11px;color:var(--ink-2);white-space:nowrap;background:var(--panel)}
.tag .dot{width:7px;height:7px;border-radius:99px;flex:none}
.dot-E{background:var(--e)} .dot-S{background:var(--s)} .dot-G{background:var(--g)}

/* ================= list / teams views ================= */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:190px;max-width:340px}
.search input{padding-left:34px;border-radius:99px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;width:14px;height:14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:grid;grid-template-columns:minmax(0,1fr) 118px 132px 104px;gap:16px;align-items:center;
  padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  cursor:pointer;text-align:left;width:100%;
}
.item:hover{background:var(--panel-2);border-color:var(--muted)}

<script>
/* ============================ helpers ============================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl2 = s => esc(s).replace(/\n/g, "<br>");
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const ESG = { E: "환경 (Environmental)", S: "사회 (Social)", G: "지배구조 (Governance)" };
const ESG_SHORT = { E: "환경", S: "사회", G: "지배구조" };
const ST = { todo: "미착수", doing: "진행중", done: "완료" };
const ST_ORDER = ["todo", "doing", "done"];
const ST_WEIGHT = { todo: 0, doing: 0.5, done: 1 };
const STATUS_VAR = { ok: "var(--ok)", warn: "var(--warn)", risk: "var(--risk)", done: "var(--done)", none: "var(--muted)" };
const ESG_ICON = {
  E: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 17c0-5 2.6-8.4 6.6-9.4C16.6 12.4 14 16 10 17Z"/><path d="M10 17C6 16 3.4 12.4 3.4 7.6 7.4 8.6 10 12 10 17Z"/></svg>',
  S: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="6.4" r="2.6"/><path d="M4.4 16.4c0-3.1 2.5-5.2 5.6-5.2s5.6 2.1 5.6 5.2"/></svg>',
  G: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 3l6.4 3.1v4.3c0 3.4-2.6 6.2-6.4 7.2-3.8-1-6.4-3.8-6.4-7.2V6.1L10 3Z"/><path d="M7.6 10.2l1.8 1.8 3.2-3.4"/></svg>'
};

/* --- 기간: 분기("2026-Q3")와 월("2026-07") --- */
const isQuarter = p => /-Q[1-4]$/.test(String(p));
function curQuarter(d = new Date()) { return d.getFullYear() + "-Q" + (Math.floor(d.getMonth() / 3) + 1); }
function curMonth(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function qIdx(p) { const [y, q] = String(p).split("-Q"); return (+y) * 4 + (+q - 1); }
function qFromIdx(i) { return Math.floor(i / 4) + "-Q" + (i % 4 + 1); }
function pSort(p) {
  if (isQuarter(p)) { const [y, q] = p.split("-Q"); return (+y) * 12 + (+q * 3 - 1); }
  const [y, m] = String(p).split("-"); return (+y) * 12 + (+m - 1);
}
function pLabel(p) {
  if (isQuarter(p)) { const [y, q] = p.split("-Q"); return "'" + String(y).slice(2) + " " + q + "Q"; }
  const [y, m] = String(p).split("-"); return "'" + String(y).slice(2) + "." + m;
}
function quarterOptions(back = 8, fwd = 1) {
  const now = qIdx(curQuarter()), out = [];
  for (let i = now + fwd; i >= now - back; i--) out.push(qFromIdx(i));
  return out;
}
function monthOptions(back = 14, fwd = 1) {
  const d = new Date(), base = d.getFullYear() * 12 + d.getMonth(), out = [];
  for (let i = base + fwd; i >= base - back; i--) out.push(Math.floor(i / 12) + "-" + String(i % 12 + 1).padStart(2, "0"));
  return out;
}
function relTime(iso) {
  if (!iso) return "—";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "일 전";
  return new Date(iso).toLocaleDateString("ko-KR", { year: "2-digit", month: "2-digit", day: "2-digit" });
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
const normTeam = s => String(s || "").replace(/[\s\-_·.()]/g, "").toLowerCase();
/** 팀 색: 이름 해시로 고정된 색을 준다. 같은 팀은 늘 같은 색. */
const TEAM_HUES = [212, 152, 28, 268, 340, 188, 48, 96];
function teamColor(name) {
  let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 9973;
  return "hsl(" + TEAM_HUES[h % TEAM_HUES.length] + " 62% 48%)";
}
const initials = n => String(n || "?").replace(/팀$|부$|실$/, "").slice(0, 2);

/* ============================ state ============================ */
const state = {
  db: null, ready: false, dbFailed: false, canEdit: false, probed: false,
  teams: [], strategies: [], progress: [],
  view: "dash", selected: null, tlScroll: null,
  filters: { q: "", team: "", esg: "", status: "" },
  me: { team: "", name: "" }
};
try { const m = JSON.parse(localStorage.getItem("esg.me") || "null"); if (m) state.me = m; } catch (e) { }

/* ---- derived ---- */
const teamName = id => { const t = state.teams.find(x => x.id === id); return t ? t.name : ""; };
function teamOf(s) { return teamName(s.teamId) || s.team || "미지정"; }
function teamKeyOf(s) { return s.teamId || ("name:" + (s.team || "미지정")); }
function plansOf(s) {
  const p = s.plans;
  if (!Array.isArray(p)) return [];
  return p.map(x => typeof x === "string" ? { text: x, status: "todo" } : { text: x.text || "", status: ST[x.status] ? x.status : "todo" });
}
/** 달성률 = (완료 + 진행중×0.5) ÷ 전체 항목 */
function pctOf(s) {
  const p = plansOf(s);
  if (!p.length) return 0;
  return Math.round(p.reduce((a, x) => a + ST_WEIGHT[x.status], 0) / p.length * 100);
}
function planCounts(s) {
  const p = plansOf(s), c = { todo: 0, doing: 0, done: 0 };
  p.forEach(x => c[x.status]++); c.total = p.length; return c;
}
function progressFor(id) {
  return state.progress.filter(p => p.strategyId === id).sort((a, b) => pSort(b.period) - pSort(a.period));
}
function latestOf(id) { return progressFor(id)[0] || null; }
function expectedPct(s) {
  const total = ((s.endYear - s.startYear) + 1) * 4;
  if (!(total > 0)) return 0;
  const done = qIdx(curQuarter()) - (s.startYear * 4) + 1;
  return clamp(Math.round(done / total * 100), 0, 100);
}
function statusOf(s) {
  const p = pctOf(s), e = expectedPct(s);
  if (p >= 100) return { key: "done", label: "완료", cls: "s-done" };
  if (p === 0 && !latestOf(s.id)) return { key: "none", label: "미착수", cls: "s-none" };
  const d = p - e;
  if (d >= -5) return { key: "ok", label: "정상", cls: "s-ok" };
  if (d >= -20) return { key: "warn", label: "지연", cls: "s-warn" };
  return { key: "risk", label: "위험", cls: "s-risk" };
}
function submittedThisQuarter(id) { return state.progress.some(p => p.strategyId === id && p.period === curQuarter()); }
function avg(arr) { return arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0; }
function activeTeamKeys() {
  const seen = new Map();
  state.strategies.forEach(s => { const k = teamKeyOf(s); if (!seen.has(k)) seen.set(k, teamOf(s)); });
  return [...seen].map(([key, name]) => ({ key, name })).sort((a, b) => a.name.localeCompare(b.name, "ko"));
}
function teamRollup() {
  return activeTeamKeys().map(t => {
    const list = state.strategies.filter(s => teamKeyOf(s) === t.key);
    const stc = { ok: 0, warn: 0, risk: 0, done: 0, none: 0 }; list.forEach(s => stc[statusOf(s).key]++);
    return {
      key: t.key, name: t.name, n: list.length, list, stc,
      pct: avg(list.map(pctOf)), exp: avg(list.map(expectedPct)),
      sub: list.filter(s => submittedThisQuarter(s.id)).length,
      last: list.map(s => latestOf(s.id)).filter(Boolean).sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""))[0],
      owners: [...new Set(list.map(s => s.owner).filter(Boolean))]
    };
  }).sort((a, b) => b.pct - a.pct);
}
function filtered() {
  const f = state.filters, q = f.q.trim().toLowerCase();
  return state.strategies.filter(s => {
    if (f.team && teamKeyOf(s) !== f.team) return false;
    if (f.esg && s.esg !== f.esg) return false;
    if (f.status && statusOf(s).key !== f.status) return false;
    if (q) {
      const hay = [s.title, teamOf(s), s.owner, s.purpose, plansOf(s).map(p => p.text).join(" "), s.kpiName].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => teamOf(a).localeCompare(teamOf(b), "ko") || (b.createdAt || "").localeCompare(a.createdAt || ""));
}
function kpiPctOf(s, actual) {
  const a = Number(actual), t = Number(s.kpiTarget), b = Number(s.kpiBase);
  if (actual == null || actual === "" || isNaN(a)) return null;
  if (s.kpiTarget == null || s.kpiTarget === "" || isNaN(t)) return null;
  if (s.kpiBase != null && s.kpiBase !== "" && !isNaN(b) && b !== t) return Math.round((a - b) / (t - b) * 100);
  if (t === 0) return null;
  return Math.round(a / t * 100);
}

/* ============================ db wiring ============================ */
(async function boot() {
  render();
  let db = null;
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) { state.dbFailed = true; state.ready = true; render(); return; }
  state.db = db;

  /* 쓰기 권한 프로브: 뷰어의 공유 등급을 직접 읽을 수 없으므로 작은 쓰기를 한 번
     시도해 보고 거절되면 '보기 전용'으로 판단한다. */
  db.doc("system/writeProbe").set({ at: new Date().toISOString() })
    .then(() => { state.canEdit = true; })
    .catch(e => { state.canEdit = !(e && e.code === "invalid_argument"); })
    .finally(() => { state.probed = true; render(); });

  const onErr = () => { state.dbFailed = true; render(); };
  const sub = (name, key) => db.collection(name).onSnapshot(snap => {
    state[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.ready = true; render();
  }, onErr);
  sub("teams", "teams"); sub("strategies", "strategies"); sub("progress", "progress");
  setTimeout(() => { if (!state.ready) { state.ready = true; render(); } }, 4000);
})();

async function save(path, body, mode) {
  if (!state.db) throw { code: "no_db" };
  const ref = state.db.doc(path);
  return mode === "update" ? ref.update(body) : ref.set(body);
}
function writeError(e) {
  if (!e) return "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  if (e.code === "no_db") return "저장소에 연결되지 않아 저장할 수 없습니다. 새로고침 후 다시 시도해 주세요.";
  if (e.code === "invalid_argument") return "보기 전용 권한으로는 저장할 수 없습니다. 담당자 권한이 필요하면 ESG 사무국에 요청해 주세요.";
  if (e.code === "quota_exceeded") return "저장 한도에 도달했습니다. 오래된 과제를 정리한 뒤 다시 시도해 주세요.";
  if (e.code === "resource_exhausted") return "요청이 몰렸습니다. 잠시 후 다시 시도해 주세요.";
  return "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
}

/* ============================ render ============================ */
function render() {
  const ed = state.canEdit;
  $("#railNew").hidden = !ed; $("#topNew").hidden = !ed; $("#setMe").hidden = !ed;
  $("#topNew").disabled = !state.db;
  document.querySelectorAll("#rail .ricon[data-view], #tabs .tab").forEach(b =>
    b.dataset.view === state.view && state.view !== "detail"
      ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));

  const stack = $("#teamStack"), rolls = teamRollup();
  stack.hidden = !rolls.length;
  stack.innerHTML = rolls.slice(0, 4).map(t =>
    `<span class="av" style="background:${teamColor(t.name)}" title="${esc(t.name)} · 달성 ${t.pct}%">${esc(initials(t.name))}</span>`
  ).join("") + (rolls.length > 4 ? `<span class="more">${rolls.length - 4}+</span>` : '<span class="more"></span>');

  const m = $("#main");
  if (state.view === "detail" && state.selected) m.innerHTML = viewDetail(state.selected);
  else if (state.view === "list") m.innerHTML = viewList();
  else if (state.view === "teams") m.innerHTML = viewTeams();
  else if (state.view === "new") { state.view = "list"; render(); openStrategyForm(null); return; }
  else m.innerHTML = viewDash();
  bind(m);
  restoreTimelineScroll();
}

function banners() {
  let h = "";
  if (state.dbFailed) h += '<div class="banner">공용 저장소에 연결하지 못했습니다. 지금 입력한 내용은 저장되지 않으니, 페이지를 새로고침한 뒤 다시 시도해 주세요.</div>';
  if (state.probed && !state.canEdit) h += '<div class="banner ro">보기 전용 권한으로 접속했습니다. 등록·수정·실적 입력은 담당자 권한이 필요합니다. 권한이 필요하면 ESG 사무국에 요청해 주세요.</div>';
  return h;
}

  const cq = curQuarter(), nowI = qIdx(cq);
  const overall = avg(all.map(pctOf)), expAvg = avg(all.map(expectedPct));
  const submitted = all.filter(s => submittedThisQuarter(s.id)).length;
  const rate = Math.round(submitted / all.length * 100);
  const stc = { ok: 0, warn: 0, risk: 0, done: 0, none: 0 };
  all.forEach(s => stc[statusOf(s).key]++);
  const attn = stc.warn + stc.risk;

  /* --- 로드맵 열 범위: 과제 추진기간 전체를 덮되 현재 분기가 항상 포함되게 --- */

    const o = { risk: 0, warn: 1, none: 2, ok: 3, done: 4 };

  const headCells = Array.from({ length: N }, (_, i) => {

  const bgCells = Array.from({ length: N }, (_, i) =>

        <div class="cellrow">${bgCells}</div>
        <button class="blk esg-${s.esg}${showChip ? " has-chip" : ""}" data-open="${esc(s.id)}" style="left:${left}px;width:${w}px"
          title="${esc(s.title)} · ${s.startYear}–${s.endYear} · 달성 ${p}% · ${st.label}">
          <span class="bmid">
            ${showIcon ? `<span class="bic">${ESG_ICON[s.esg]}</span>` : ""}
            <span class="bt">${esc(s.title)}</span>

          <span class="bar"><i style="width:${p}%"></i></span>
          ${showChip ? `<span class="bchip" style="color:${STATUS_VAR[st.key]}"><span class="d" style="background:${STATUS_VAR[st.key]}"></span>${st.label} ${p}%</span>` : ""}
        </button>

  const feed = [...state.progress].sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""))[0];

  return banners() + `
  <section class="panel">
    <div class="ph">
      <div><h2>중장기전략 로드맵</h2>
      <div class="sub">과제별 추진기간과 달성률 · 블록 안 흰 선이 현재 달성률입니다</div></div>

      </div>
    </div>
    <div class="tl-wrap" id="tlWrap">
      <div class="tl">
        <div class="tl-row tl-head">
          <div class="tl-name"><span class="lbl">실행과제</span></div>
          <div class="tl-track" style="width:${trackW}px">${headCells}</div>

      ${attnList.length ? `<div class="acards">${attnList.map((s, i) => {

        const over = !submittedThisQuarter(s.id);

          <div class="ad">${esc(teamOf(s))} · ${esc(s.owner || "담당자 미지정")}</div>

/** 로드맵을 현재 분기가 보이는 위치로 스크롤. 사용자가 옮긴 위치는 유지한다. */
function restoreTimelineScroll() {
  const w = $("#tlWrap"); if (!w) return;
  if (state.tlScroll != null) { w.scrollLeft = state.tlScroll; }
  else {
    const line = w.querySelector(".nowline");
    if (line) w.scrollLeft = Math.max(0, parseFloat(line.style.left) - w.clientWidth * 0.55);
  }
  w.onscroll = () => { state.tlScroll = w.scrollLeft; };
}

function emptyState() {
  return `<div class="empty">
    <h3>${state.canEdit ? "첫 번째 중장기전략을 등록해 주세요" : "등록된 과제가 없습니다"}</h3>
    <p>실행과제명과 추진기간, 계획(목표) 세부 항목을 등록하면 항목 체크만으로 달성률이 집계되고 로드맵에 표시됩니다.</p>
    ${state.canEdit ? '<button class="btn btn-primary" data-act="new">＋ 전략 등록</button>' : ""}
  </div>`;
}

/* ============================ events ============================ */
function bind(root) {
  root.querySelectorAll("[data-open]").forEach(el => el.onclick = () => { state.selected = el.dataset.open; state.view = "detail"; render(); window.scrollTo(0, 0); });
  root.querySelectorAll("[data-toggle]").forEach(el => el.onclick = () => togglePlan(state.selected, +el.dataset.toggle));
  root.querySelectorAll("[data-act]").forEach(el => el.onclick = () => {
    const a = el.dataset.act, id = el.dataset.id;
    if (a === "new") openStrategyForm(null);
    if (a === "edit") openStrategyForm(state.strategies.find(s => s.id === id));
    if (a === "report") openProgressForm(id);
    if (a === "delete") removeStrategy(id);
    if (a === "manageTeams") openTeamsForm();
    if (a === "back") { state.view = "list"; state.selected = null; render(); }
    if (a === "export") exportCsv();
    if (a === "clearf") { state.filters = { q: "", team: "", esg: "", status: "" }; render(); }
    if (a === "goList") { state.view = "list"; state.selected = null; render(); }
    if (a === "goTeams") { state.view = "teams"; render(); }
    if (a === "goRisk") { state.filters = { q: "", team: "", esg: "", status: "warn" }; state.view = "list"; render(); }
  });
  const fq = root.querySelector("#fq");
  if (fq) fq.oninput = () => {
    state.filters.q = fq.value; const p = fq.selectionStart; render();
    const n = $("#fq"); if (n) { n.focus(); n.setSelectionRange(p, p); }
  };
  ["fteam:team", "fesg:esg", "fstatus:status"].forEach(pair => {
    const [sel, key] = pair.split(":"), el = root.querySelector("#" + sel);
    if (el) el.onchange = () => { state.filters[key] = el.value; render(); };
  });
}
document.querySelectorAll("#rail .ricon[data-view], #tabs .tab").forEach(b => b.onclick = () => {
  state.view = b.dataset.view; state.selected = null; render(); window.scrollTo(0, 0);
});
$("#setMe").onclick = () => openMeForm();
$("#topNew").onclick = () => openStrategyForm(null);
$("#topCsv").onclick = () => exportCsv();
$("#topSearch").onclick = () => {
  state.view = "list"; state.selected = null; render();
  const n = $("#fq"); if (n) n.focus();
};

async function togglePlan(sid, i) {
  const s = state.strategies.find(x => x.id === sid); if (!s || !state.canEdit) return;
  const plans = plansOf(s); if (!plans[i]) return;
  plans[i] = { ...plans[i], status: ST_ORDER[(ST_ORDER.indexOf(plans[i].status) + 1) % 3] };
  try { await save("strategies/" + sid, { plans, updatedAt: new Date().toISOString() }, "update"); }
  catch (e) { toast(writeError(e)); }
}

/* ============================ dialogs ============================ */
const dlg = $("#dlg");
function openDialog(html, onSubmit) {
  dlg.innerHTML = `<form method="dialog" id="dlgForm">${html}</form>`;
  const form = $("#dlgForm");
  form.querySelectorAll("[data-close]").forEach(b => b.onclick = e => { e.preventDefault(); dlg.close(); });
  form.onsubmit = e => {
    if (e.submitter && e.submitter.dataset.close !== undefined) return;
    e.preventDefault(); onSubmit(form);
  };
  dlg.showModal();
  const first = form.querySelector("input:not([disabled]),select,textarea"); if (first) first.focus();
  return form;
}
function teamOptions(selectedId) {

    .map(t => `<option value="${esc(t.id)}" ${t.id === selectedId ? "selected" : ""}>${esc(t.name)}</option>`).join("");

function openTeamsForm() {
  const counts = {};
  state.strategies.forEach(s => { const k = s.teamId; if (k) counts[k] = (counts[k] || 0) + 1; });
  const orphan = [...new Set(state.strategies.filter(s => !s.teamId).map(s => s.team).filter(Boolean))];
  const list = state.teams.slice().sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko"));

  const form = openDialog(`
    <div class="dlg-h"><div><h2>팀 목록 관리</h2><p>여기 등록된 팀만 과제 등록 화면에 나타납니다. 같은 팀이 다른 이름으로 쪼개지지 않도록 사무국이 관리해 주세요.</p></div>
    <button class="x" data-close type="button" aria-label="닫기">×</button></div>
    <div class="dlg-b">
      ${orphan.length ? `<div class="simwarn">아직 팀 목록에 연결되지 않은 과제가 있습니다: ${orphan.map(esc).join(", ")}. 같은 이름으로 팀을 등록한 뒤 각 과제를 수정해 팀을 다시 선택해 주세요.</div>` : ""}
      <div>
        ${list.length ? list.map(t => `
          <div class="trow">
            <div><input type="text" maxlength="40" data-name="${esc(t.id)}" value="${esc(t.name)}" aria-label="팀 이름"></div>
            <div class="tc">과제 ${counts[t.id] || 0}건</div>
            <div style="display:flex;gap:6px">
              <button type="button" class="btn btn-sm" data-rename="${esc(t.id)}">이름 저장</button>
              <button type="button" class="btn btn-sm btn-danger" data-del="${esc(t.id)}" ${counts[t.id] ? "disabled title='과제가 남아 있어 삭제할 수 없습니다'" : ""}>삭제</button>
            </div>
          </div>`).join("") : '<p class="help" style="margin:0 0 4px">등록된 팀이 없습니다. 아래에서 추가해 주세요.</p>'}
      </div>
      <fieldset class="fieldset"><legend>팀 추가</legend>
        <div class="field"><label for="tNew">팀/부서 이름</label>
          <input type="text" id="tNew" maxlength="40" placeholder="예: 품질경영팀">
          <span class="help">조직도상의 정식 명칭으로 등록해 주세요. 약칭을 따로 등록하면 달성률이 두 팀으로 나뉩니다.</span></div>
        <div id="tSim"></div>
        <div><button type="button" class="btn btn-primary" id="tAdd">팀 추가</button></div>
      </fieldset>
      <div class="err" id="tErr" hidden></div>
    </div>
    <div class="dlg-f"><button class="btn" data-close type="button">닫기</button></div>`,
    () => { });

  const err = $("#tErr"), sim = $("#tSim"), input = $("#tNew");
  const fail = e => { err.hidden = false; err.textContent = writeError(e); };

  input.oninput = () => {
    const n = normTeam(input.value);
    const hit = n ? state.teams.filter(t => normTeam(t.name) === n || (n.length > 2 && (normTeam(t.name).includes(n) || n.includes(normTeam(t.name))))) : [];
    sim.innerHTML = hit.length
      ? `<div class="simwarn">비슷한 팀이 이미 있습니다: <b>${hit.map(t => esc(t.name)).join(", ")}</b>. 같은 팀이라면 추가하지 말고 기존 팀을 쓰세요.</div>` : "";
  };
  $("#tAdd").onclick = async () => {
    const name = input.value.trim();
    if (!name) { err.hidden = false; err.textContent = "팀 이름을 입력해 주세요."; return; }
    if (state.teams.some(t => normTeam(t.name) === normTeam(name))) { err.hidden = false; err.textContent = "이미 같은 팀이 등록되어 있습니다."; return; }
    try {
      await state.db.collection("teams").add({ name, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
      dlg.close(); toast("'" + name + "' 팀을 추가했습니다."); openTeamsForm();
    } catch (e) { fail(e); }
  };
  form.querySelectorAll("[data-rename]").forEach(b => b.onclick = async () => {
    const t = state.teams.find(x => x.id === b.dataset.rename); if (!t) return;
    const input2 = form.querySelector('[data-name="' + t.id + '"]');
    const name = (input2 ? input2.value : "").trim();
    if (!name) { err.hidden = false; err.textContent = "팀 이름은 비워둘 수 없습니다."; return; }
    if (name === t.name) { toast("변경된 내용이 없습니다."); return; }
    if (state.teams.some(x => x.id !== t.id && normTeam(x.name) === normTeam(name))) {
      err.hidden = false; err.textContent = "이미 같은 팀이 등록되어 있습니다."; return;
    }
    try {
      await save("teams/" + t.id, { name, updatedAt: new Date().toISOString() }, "update");
      dlg.close(); toast("팀 이름을 수정했습니다."); openTeamsForm();
    } catch (e) { fail(e); }
  });
  form.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const t = state.teams.find(x => x.id === b.dataset.del); if (!t) return;
    try {
      await state.db.doc("teams/" + t.id).delete();
      dlg.close(); toast("'" + t.name + "' 팀을 삭제했습니다."); openTeamsForm();
    } catch (e) { fail(e); }
  });
}

function openStrategyForm(s) {
  if (!state.canEdit) { toast("보기 전용 권한으로는 등록할 수 없습니다."); return; }
  if (!state.me.name) { openMeForm(() => openStrategyForm(s)); return; }
  const y = new Date().getFullYear();
  const plans = s ? plansOf(s) : [];
  const planText = plans.map(p => p.text).join("\n");
  const myTeamId = (state.teams.find(t => t.name === state.me.team) || {}).id;

  openDialog(`
    <div class="dlg-h"><div><h2>${s ? "중장기전략 수정" : "중장기전략 등록"}</h2>
    <p>${s ? esc(teamOf(s)) + " · " + esc(s.title) : "실행과제 단위로 등록합니다. 계획 항목을 체크하면 달성률이 자동 계산됩니다."}</p></div>
    <button class="x" data-close type="button" aria-label="닫기">×</button></div>
    <div class="dlg-b">
      <fieldset class="fieldset"><legend>과제 개요</legend>
        <div class="field"><label for="fTitle">실행과제(명)<span class="req">*</span></label>
          <input type="text" id="fTitle" required maxlength="120" value="${s ? esc(s.title) : ""}" placeholder="예: 환경성적표지(EPD) 인증 획득 및 활용"></div>
        <div class="row3">
          <div class="field"><label for="fEsg">ESG 영역<span class="req">*</span></label>
            <select id="fEsg" required>${["E", "S", "G"].map(k => `<option value="${k}" ${s && s.esg === k ? "selected" : ""}>${ESG[k]}</option>`).join("")}</select></div>
          <div class="field"><label for="fTeam">담당 팀/부서<span class="req">*</span></label>
            ${state.teams.length
      ? `<select id="fTeam" required><option value="">선택하세요</option>${teamOptions(s ? s.teamId : myTeamId)}</select>`
      : `<input type="text" id="fTeamText" required value="${s ? esc(teamOf(s)) : esc(state.me.team)}">
                 <span class="help">팀 목록이 비어 있어 직접 입력으로 받습니다.</span>`}
          </div>
          <div class="field"><label for="fOwner">실무 담당자</label>
            <input type="text" id="fOwner" value="${s ? esc(s.owner || "") : esc(state.me.name)}"></div>
        </div>
        <div class="row3">
          <div class="field"><label for="fStart">추진 시작연도<span class="req">*</span></label>
            <input type="number" id="fStart" required min="2015" max="2050" value="${s ? s.startYear : y}"></div>
          <div class="field"><label for="fEnd">목표 완료연도<span class="req">*</span></label>
            <input type="number" id="fEnd" required min="2015" max="2050" value="${s ? s.endYear : y + 2}"></div>
          <div class="field"><label for="fPri">우선순위</label>
            <select id="fPri">${["상", "중", "하"].map(pp => `<option ${s ? (s.priority === pp ? "selected" : "") : (pp === "중" ? "selected" : "")}>${pp}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label for="fPurpose">추진 배경 · 목적</label>
          <textarea id="fPurpose" placeholder="이 과제를 추진하는 이유와 기대효과를 적어 주세요.">${s ? esc(s.purpose || "") : ""}</textarea></div>
      </fieldset>

      <fieldset class="fieldset"><legend>계획(목표) — 달성률의 근거</legend>
        <div class="field"><label for="fPlans">세부 계획 <span class="help">— 한 줄에 하나씩. 이 항목 수가 달성률의 분모가 됩니다.</span></label>
          <textarea id="fPlans" style="min-height:130px" placeholder="추진 계획 수립, TFT 구성 및 구성원 교육&#10;제품 시스템 경계 및 공정 분석, LCA 분석&#10;LCA/EPD 보고서 작성 및 제출, 인증 획득">${esc(planText)}</textarea>
          <span class="help">항목 상태(미착수·진행중·완료)는 등록 후 과제 상세 화면에서 클릭해 바꿉니다.</span></div>
      </fieldset>

      <fieldset class="fieldset"><legend>성과지표 (KPI) — 선택</legend>
        <div class="row2">
          <div class="field"><label for="fKpiName">지표명</label>
            <input type="text" id="fKpiName" value="${s ? esc(s.kpiName || "") : ""}" placeholder="예: EPD 인증 취득 제품 수"></div>
          <div class="field"><label for="fKpiUnit">단위</label>
            <input type="text" id="fKpiUnit" maxlength="16" value="${s ? esc(s.kpiUnit || "") : ""}" placeholder="예: 건, %, tCO2e"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="fKpiBase">기준값 (Baseline)</label>
            <input type="number" step="any" id="fKpiBase" value="${s && s.kpiBase != null ? esc(s.kpiBase) : ""}"></div>
          <div class="field"><label for="fKpiTarget">목표값<span class="help"> — 기준값과 함께 넣으면 배출량·재해율처럼 낮출수록 좋은 지표도 달성률이 계산됩니다.</span></label>
            <input type="number" step="any" id="fKpiTarget" value="${s && s.kpiTarget != null ? esc(s.kpiTarget) : ""}"></div>
        </div>
      </fieldset>
      <div class="err" id="fErr" hidden></div>
    </div>
    <div class="dlg-f"><button class="btn" data-close type="button">취소</button>
    <button class="btn btn-primary" type="submit">${s ? "수정 저장" : "등록"}</button></div>`,
    async form => {
      const err = $("#fErr");
      const sy = +form.fStart.value, ey = +form.fEnd.value;
      if (ey < sy) { err.hidden = false; err.textContent = "목표 완료연도는 추진 시작연도보다 빠를 수 없습니다."; return; }
      const texts = form.fPlans.value.split("\n").map(x => x.replace(/^[-·•*\s]+/, "").trim()).filter(Boolean);
      if (!texts.length) { err.hidden = false; err.textContent = "달성률은 계획 항목으로 계산합니다. 세부 계획을 한 줄 이상 입력해 주세요."; return; }
      const prev = new Map(plans.map(pp => [pp.text, pp.status]));
      const newPlans = texts.map(t => ({ text: t, status: prev.get(t) || "todo" }));
      const teamSel = form.fTeam ? form.fTeam.value : "";
      const body = {
        title: form.fTitle.value.trim(), esg: form.fEsg.value,
        teamId: teamSel || (s ? s.teamId : null) || null,
        team: form.fTeamText ? form.fTeamText.value.trim() : (teamSel ? teamName(teamSel) : (s ? s.team : "")) || "",
        owner: form.fOwner.value.trim(), startYear: sy, endYear: ey, priority: form.fPri.value,
        purpose: form.fPurpose.value.trim(), plans: newPlans,
        kpiName: form.fKpiName.value.trim(), kpiUnit: form.fKpiUnit.value.trim(),
        kpiBase: form.fKpiBase.value === "" ? null : +form.fKpiBase.value,
        kpiTarget: form.fKpiTarget.value === "" ? null : +form.fKpiTarget.value,
        updatedAt: new Date().toISOString(),
        createdBy: s ? s.createdBy : state.me.name,
        createdAt: s ? s.createdAt : new Date().toISOString()
      };
      if (state.teams.length && !body.teamId) { err.hidden = false; err.textContent = "담당 팀을 선택해 주세요."; return; }
      try {
        if (s) await save("strategies/" + s.id, body);
        else { const ref = await state.db.collection("strategies").add(body); state.selected = ref.id; state.view = "detail"; }
        dlg.close(); toast(s ? "과제를 수정했습니다." : "전략을 등록했습니다. 계획 항목을 클릭해 진행 상태를 표시해 주세요."); render();
      } catch (e2) { err.hidden = false; err.textContent = writeError(e2); }
    });
}

function openProgressForm(id) {
  if (!state.canEdit) { toast("보기 전용 권한으로는 실적을 입력할 수 없습니다."); return; }
  if (!state.me.name) { openMeForm(() => openProgressForm(id)); return; }
  const s = state.strategies.find(x => x.id === id); if (!s) return;
  const cq = curQuarter(), cm = curMonth();
  const plans = plansOf(s);
  let draft = plans.map(p => p.status);
  const calcPct = () => plans.length ? Math.round(draft.reduce((a, st) => a + ST_WEIGHT[st], 0) / plans.length * 100) : 0;

  const form = openDialog(`
    <div class="dlg-h"><div><h2>실적 입력</h2><p>${esc(teamOf(s))} · ${esc(s.title)}</p></div>
    <button class="x" data-close type="button" aria-label="닫기">×</button></div>
    <div class="dlg-b">
      <div class="row2">
        <div class="field"><label for="pKind">보고 단위<span class="req">*</span></label>
          <select id="pKind"><option value="q">분기 (필수 보고)</option><option value="m">월 (중간 기록, 선택)</option></select>
          <span class="help">미제출 독촉과 팀 집계는 분기 보고를 기준으로 합니다.</span></div>
        <div class="field"><label for="pPeriod">보고 시점<span class="req">*</span></label>
          <select id="pPeriod" required></select>
          <span class="help" id="pDup" hidden></span></div>
      </div>

      <fieldset class="fieldset"><legend>계획 항목 진행 상태 — 달성률이 여기서 나옵니다</legend>
        ${plans.length ? `<ul class="plans" id="pPlans">${plans.map((x, i) => `
          <li data-st="${x.status}"><button type="button" class="pchip" data-st="${x.status}" data-i="${i}">${ST[x.status]}</button>
          <span class="ptext">${esc(x.text)}</span></li>`).join("")}</ul>`
      : '<p class="help" style="margin:0">등록된 계획 항목이 없습니다. 과제 수정에서 세부 계획을 먼저 넣어 주세요.</p>'}
        <div class="calcbox">
          <div class="n num" id="pCalc">${calcPct()}%</div>
          <div class="d">계산된 달성률<br><span id="pCalcD">완료 ${draft.filter(x => x === "done").length} · 진행중 ${draft.filter(x => x === "doing").length} · 전체 ${plans.length}</span></div>
          <div class="d" style="margin-left:auto">기간경과 기대치 <b class="num">${expectedPct(s)}%</b></div>
        </div>
      </fieldset>

      <div class="field"><label for="pAch">해당 기간 실적<span class="req">*</span></label>
        <textarea id="pAch" required placeholder="예: UL 측 EPD Report 최종 보고서 제출 및 심사 대응 (26.04~08)&#10;UL EPD 인증 획득 (26.08.04)"></textarea></div>

      ${s.kpiTarget != null && s.kpiTarget !== "" ? `
      <div class="field"><label for="pKpi">KPI 실적 — ${esc(s.kpiName || "지표")}${s.kpiUnit ? " (" + esc(s.kpiUnit) + ")" : ""}</label>
        <input type="number" step="any" id="pKpi" placeholder="목표 ${esc(s.kpiTarget)}"></div>` : ""}

      <div class="field"><label for="pDelay">계획대비 지연 사유 <span class="help">— 기대치 미달 시 필수</span></label>
        <textarea id="pDelay" placeholder="계획 대비 지연된 항목과 원인, 개선 필요사항을 적어 주세요."></textarea></div>

      <div class="field"><label for="pPlan">Catch-up / Follow-up Plan</label>
        <textarea id="pPlan" placeholder="다음 기간 만회 계획 또는 후속 추진 계획"></textarea></div>
      <div class="err" id="pErr" hidden></div>
    </div>
    <div class="dlg-f"><button class="btn" data-close type="button">취소</button>
    <button class="btn btn-primary" type="submit" id="pSubmit">실적 제출</button></div>`,
    async form => {
      const err = $("#pErr"), period = form.pPeriod.value, pct = calcPct();
      if (pct < expectedPct(s) - 5 && !form.pDelay.value.trim() && pct < 100) {
        err.hidden = false; err.textContent = "기대치보다 진척이 낮습니다. 지연 사유를 입력해 주세요."; $("#pDelay").focus(); return;
      }
      const body = {
        strategyId: id, period, progress: pct,
        achievement: form.pAch.value.trim(),
        kpiActual: form.pKpi && form.pKpi.value !== "" ? +form.pKpi.value : null,
        delayReason: form.pDelay.value.trim(), catchupPlan: form.pPlan.value.trim(),
        author: state.me.name, team: state.me.team || teamOf(s), updatedAt: new Date().toISOString()
      };
      try {
        const newPlans = plans.map((p, i) => ({ ...p, status: draft[i] }));
        if (plans.length) await save("strategies/" + id, { plans: newPlans, updatedAt: body.updatedAt }, "update");
        await save("progress/" + id + "__" + period, body);
        dlg.close(); toast(period.replace("-", " ") + " 실적을 저장했습니다. 달성률 " + pct + "%");
      } catch (e2) { err.hidden = false; err.textContent = writeError(e2); }
    });

  const kind = $("#pKind"), sel = $("#pPeriod"), pd = $("#pDup"), submit = $("#pSubmit");
  const checkDup = () => {
    const hit = state.progress.find(p => p.strategyId === id && p.period === sel.value);
    pd.hidden = !hit;
    submit.textContent = hit ? "실적 수정" : "실적 제출";
    if (hit) pd.textContent = "이미 제출된 기간입니다. 저장하면 기존 내용을 덮어씁니다.";
    form.pAch.value = hit ? (hit.achievement || "") : "";
    form.pDelay.value = hit ? (hit.delayReason || "") : "";
    form.pPlan.value = hit ? (hit.catchupPlan || "") : "";
    if (form.pKpi) form.pKpi.value = hit && hit.kpiActual != null ? hit.kpiActual : "";
  };
  const fillPeriods = () => {
    const q = kind.value === "q";
    const opts = q ? quarterOptions() : monthOptions(), cur = q ? cq : cm;
    sel.innerHTML = opts.map(p => `<option value="${p}" ${p === cur ? "selected" : ""}>${p.replace("-", " ")}${p === cur ? " (현재)" : ""}</option>`).join("");
    checkDup();
  };
  kind.onchange = fillPeriods; sel.onchange = checkDup; fillPeriods();

  form.querySelectorAll("#pPlans .pchip").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    draft[i] = ST_ORDER[(ST_ORDER.indexOf(draft[i]) + 1) % 3];
    b.dataset.st = draft[i]; b.textContent = ST[draft[i]]; b.closest("li").dataset.st = draft[i];
    $("#pCalc").textContent = calcPct() + "%";
    $("#pCalcD").textContent = `완료 ${draft.filter(x => x === "done").length} · 진행중 ${draft.filter(x => x === "doing").length} · 전체 ${plans.length}`;
  });
}

async function removeStrategy(id) {
  const s = state.strategies.find(x => x.id === id); if (!s || !state.canEdit) return;
  const logs = progressFor(id);
  openDialog(`
    <div class="dlg-h"><div><h2>과제를 삭제할까요?</h2><p>${esc(s.title)}</p></div></div>
    <div class="dlg-b"><p style="margin:0;font-size:13px">이 과제와 함께 등록된 실적 ${logs.length}건이 모두 삭제됩니다. 되돌릴 수 없습니다.</p></div>
    <div class="dlg-f"><button class="btn" data-close type="button">취소</button>
    <button class="btn btn-danger" type="submit">삭제</button></div>`,
    async () => {
      try {
        await Promise.all(logs.map(l => state.db.doc("progress/" + l.id).delete()));
        await state.db.doc("strategies/" + id).delete();
        dlg.close(); state.view = "list"; state.selected = null; render(); toast("과제를 삭제했습니다.");
      } catch (e) { dlg.close(); toast(writeError(e)); }
    });
}

/* ============================ CSV ============================ */
async function exportCsv() {
  const cols = ["ESG영역", "팀", "실행과제명", "담당자", "시작연도", "완료연도", "우선순위",
    "달성률(%)", "기대치(%)", "상태", "계획항목수", "완료", "진행중", "미착수",
    "KPI", "단위", "기준값", "목표값",
    "보고시점", "보고단위", "제출시점달성률(%)", "KPI실적", "실적내용", "지연사유", "CatchUpPlan", "작성자", "갱신일시"];
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [cols.map(q).join(",")];
  state.strategies.forEach(s => {
    const c = planCounts(s), logs = progressFor(s.id);
    const base = [ESG_SHORT[s.esg], teamOf(s), s.title, s.owner, s.startYear, s.endYear, s.priority,
      pctOf(s), expectedPct(s), statusOf(s).label, c.total, c.done, c.doing, c.todo,
      s.kpiName, s.kpiUnit, s.kpiBase, s.kpiTarget];
    if (!logs.length) lines.push([...base, "", "", "", "", "", "", "", "", ""].map(q).join(","));
    else logs.forEach(l => lines.push([...base,
      l.period, isQuarter(l.period) ? "분기" : "월", l.progress, l.kpiActual ?? "",
      l.achievement || "", l.delayReason || "", l.catchupPlan || "", l.author || "", l.updatedAt || ""].map(q).join(",")));
  });
  const data = "﻿" + lines.join("\r\n");
  const filename = "ESG_중장기전략_" + curQuarter() + ".csv";
  let dl = null;
  try { dl = await claude.use("downloads"); } catch (e) { dl = null; }
  if (dl) { try { await dl.save({ filename, data }); toast("CSV를 저장했습니다."); return; } catch (e) { } }
  try { await navigator.clipboard.writeText(data); toast("파일 저장을 사용할 수 없어 CSV 내용을 클립보드에 복사했습니다."); }
  catch (e) { toast("CSV를 내보내지 못했습니다."); }
}
